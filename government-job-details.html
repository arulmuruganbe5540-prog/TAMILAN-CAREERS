(function(){

 const title=(j.job_title||'Government Job').replace(/\s+/g,' ').trim();

 document.title=title+' | TAMILAN CAREERS';setMeta('description',desc);setMeta('og:title',document.title,'property');setMeta('og:description',desc,'property');setMeta('og:url',canonical,'property');

function prepSection(title,value,asLinks){
 if(!value||!String(value).trim())return '';
 const lines=String(value).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
 const body=asLinks?'<ul>'+lines.map(line=>{const parts=line.split('|');const label=(parts[0]||'Resource').trim();const href=parts.length>1?url(parts.slice(1).join('|').trim()):'';return '<li>'+(href?'<a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(label)+'</a>':esc(line))+'</li>';}).join('')+'</ul>':'<p style="white-space:pre-wrap">'+esc(value)+'</p>';

function sharePanel(title){const pageUrl=encodeURIComponent(location.href),shareText=encodeURIComponent(title+' | TAMILAN CAREERS');return '<section class="share-panel"><h2>Share This Job</h2><div class="share-actions"><a target="_blank" rel="noopener noreferrer" href="https://www.facebook.com/sharer/sharer.php?u='+pageUrl+'">Facebook</a><a class="wa" target="_blank" rel="noopener noreferrer" href="https://api.whatsapp.com/send?text='+shareText+'%20'+pageUrl+'">WhatsApp</a><button type="button" class="instagram" data-native-share>Instagram</button><a class="wa" target="_blank" rel="noopener noreferrer" href="https://api.whatsapp.com/send?text='+shareText+'%20'+pageUrl+'">WhatsApp Group</a><button type="button" class="copy" data-copy-link>Copy Link</button></div></section>';}

 return '<section class="prep-section" id="postMessages"><h2>Comments</h2><p class="muted">Only signed-in users can post. Your account email is shown beside your message.</p><div id="postMessageNotice" class="notice" role="status" aria-live="polite"></div><div id="postMessageList"></div><div id="postMessageAuth"></div><form id="postMessageForm" hidden><label for="postMessageText">Write a comment</label><textarea id="postMessageText" maxlength="2000" required style="width:100%;min-height:90px;padding:10px;border:1px solid #b9c7d8;border-radius:5px"></textarea><button type="submit" id="postMessageBtn" style="margin-top:10px">Post Comment</button></form></section>';

async function loadMessages(table,jobId){
 const list=document.getElementById('postMessageList'),notice=document.getElementById('postMessageNotice'),authBox=document.getElementById('postMessageAuth'),form=document.getElementById('postMessageForm');
 const {data,error}=await sb.from(table).select('id,sender_email,message,created_at').eq('job_id',jobId).eq('status','visible').order('created_at',{ascending:true}).limit(100);
 if(error){notice.textContent='Messages could not be loaded right now.';return}
 list.innerHTML=(data||[]).length?(data||[]).map(m=>'<article style="padding:12px 0;border-bottom:1px solid #e1e8f0"><b>'+esc(m.sender_email)+'</b><small style="display:block;color:#65738b">'+fmt(m.created_at)+'</small><p style="white-space:pre-wrap;margin:6px 0">'+esc(m.message)+'</p></article>').join():'<p class="muted">No comments yet.</p>';
 const {data:authData,error:authError}=await sb.auth.getUser(),user=authData?.user;
 if(authError||!user||!user.email){authBox.innerHTML='<p class="muted">Please <a href="auth.html?redirect='+encodeURIComponent(location.pathname+location.search)+'">sign in or register</a> to post a message. Visitors who are not logged in cannot post.</p>';return}
 authBox.textContent='Posting as '+user.email;form.hidden=false;
 form.addEventListener('submit',async e=>{
  e.preventDefault();const message=document.getElementById('postMessageText').value.trim(),btn=document.getElementById('postMessageBtn');
  if(!message){notice.textContent='Enter a message before posting.';return}
  btn.disabled=true;notice.textContent='Posting…';
  const {error:insertError}=await sb.from(table).insert({job_id:jobId,user_id:user.id,sender_email:user.email,message,status:'visible'});
  btn.disabled=false;
  if(insertError){notice.textContent='Message was not posted. Please sign in again and retry.';return}
  document.getElementById('postMessageText').value='';notice.textContent='Write a comment was posted.';await loadMessagesListOnly(table,jobId);
 });
}

 list.innerHTML=(data||[]).length?(data||[]).map(m=>'<article style="padding:12px 0;border-bottom:1px solid #e1e8f0"><b>'+esc(m.sender_email)+'</b><small style="display:block;color:#65738b">'+fmt(m.created_at)+'</small><p style="white-space:pre-wrap;margin:6px 0">'+esc(m.message)+'</p></article>').join():'<p class="muted">No comments yet.</p>';
}
