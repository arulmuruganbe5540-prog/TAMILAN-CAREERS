<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>One-Time Super Admin Registration | TAMILAN CAREERS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f6fb;color:#14213d;font:16px Arial,sans-serif}.card{width:min(100%,440px);padding:26px;background:#fff;border:1px solid #dce4ef;border-radius:14px;box-shadow:0 12px 32px #10213b12}h1{margin:0 0 8px;color:#101d3a;font-size:24px}.sub{color:#65738b;line-height:1.55;margin:0 0 20px}.field{margin:14px 0}.field label{display:block;margin-bottom:6px;font-weight:700;font-size:14px}.field input{width:100%;padding:12px;border:1px solid #b9c8d9;border-radius:7px;font-size:16px}.field input[readonly]{background:#eef3f8;color:#40536c}.primary{width:100%;padding:13px;border:0;border-radius:7px;background:#176b9e;color:white;font-weight:700;font-size:16px;cursor:pointer}.primary:disabled{opacity:.6;cursor:wait}.notice{display:none;margin:14px 0;padding:11px;border-radius:7px;line-height:1.5;font-size:14px}.notice.show{display:block}.notice.error{background:#fff0ef;color:#a1261b}.notice.success{background:#eaf7ef;color:#17613b}.foot{margin-top:18px;text-align:center;font-size:13px}.foot a{color:#176b9e}
</style>
</head>
<body>
<main class="card">
<h1>Super Admin Registration</h1>
<p class="sub">This is a private, one-time setup link for the authorized TAMILAN CAREERS administrator. Only the approved email address can complete registration. After successful registration, this link will permanently stop working.</p>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<form id="registerForm">
<div class="field"><label for="email">Authorized email</label><input id="email" type="email" value="arulmuruganbe5540@gmail.com" readonly></div>
<div class="field"><label for="password">Create password</label><input id="password" type="password" minlength="10" autocomplete="new-password" required placeholder="At least 10 characters"></div>
<div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required></div>
<button class="primary" id="registerButton" type="submit">Register Super Admin (One Time)</button>
</form>
<div class="foot"><a href="super-admin.html">Super Admin Login</a></div>
</main>
<script>
(function(){
const SUPABASE_URL='https://qkmljuuusfjowexvybvy.supabase.co';
const SUPABASE_KEY='sb_publishable_Wi6gltM_xFm1m4Dlgq727Q_83Rn58y2';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const token=new URLSearchParams(location.search).get('token')||'';
const allowedEmail='arulmuruganbe5540@gmail.com';
function show(message,type){$('notice').textContent=message;$('notice').className='notice show '+type;}
function setBusy(busy){$('registerButton').disabled=busy;$('registerButton').textContent=busy?'Please wait…':'Register Super Admin (One Time)';}
async function claim(){
 if(!token){show('This one-time registration link is missing its secure code. Please use the private link supplied to you.','error');return false;}
 const {data,error}=await sb.rpc('claim_initial_super_admin',{p_token:token});
 if(error){show(error.message||'Registration could not be completed.','error');return false;}
 show('Super Admin registration completed. Opening the secure login page…','success');
 setTimeout(()=>{location.href='super-admin.html';},1200);
 return true;
}
(async()=>{
 const {data:{session}}=await sb.auth.getSession();
 if(session&&session.user?.email?.toLowerCase()===allowedEmail){await claim();return;}
 if(session){await sb.auth.signOut();}
 if(!token){$('registerForm').hidden=true;show('Invalid registration link.','error');}
})();
$('registerForm').addEventListener('submit',async e=>{
 e.preventDefault();
 if(!token){show('Invalid registration link.','error');return;}
 const password=$('password').value;
 if(password.length<10){show('Use a password with at least 10 characters.','error');return;}
 if(password!==$('confirmPassword').value){show('The passwords do not match.','error');return;}
 setBusy(true);
 const {data,error}=await sb.auth.signUp({
  email:allowedEmail,
  password,
  options:{emailRedirectTo:location.origin+location.pathname+'?token='+encodeURIComponent(token)}
 });
 setBusy(false);
 if(error){show(error.message,'error');return;}
 if(data.session){await claim();return;}
 show('Registration request received. Check the authorized email inbox, confirm the email, and return through the same private link to finish Super Admin setup.','success');
});
})();
</script>
</body>
</html>
