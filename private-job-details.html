function messagePanel(){return '<section class="notice" style="background:#fff;border:1px solid #dce4ef;border-radius:8px;padding:16px;margin-top:18px"><h2 style="font-size:20px;color:#102849">Questions and Messages</h2><p class="meta">Only signed-in users can post. Your account email is shown beside your message.</p><div id="postMessageNotice" class="meta" role="status"></div><div id="postMessageList"></div><div id="postMessageAuth" class="meta"></div><form id="postMessageForm" hidden><label for="postMessageText"><b>Your message</b></label><textarea id="postMessageText" maxlength="2000" required style="width:100%;min-height:90px;padding:10px;border:1px solid #b9c7d8;border-radius:5px;font:inherit"></textarea><button id="postMessageBtn" type="submit" style="margin-top:10px">Post message</button></form></section>';}
async function loadMessages(table,jobId){
 const list=document.getElementById('postMessageList'),notice=document.getElementById('postMessageNotice'),authBox=document.getElementById('postMessageAuth'),form=document.getElementById('postMessageForm');
 async function refresh(){const {data,error}=await db.from(table).select('id,sender_email,message,created_at').eq('job_id',jobId).eq('status','visible').order('created_at',{ascending:true}).limit(100);if(error){notice.textContent='Messages could not be loaded right now.';return}list.innerHTML=(data||[]).length?(data||[]).map(m=>'<article style="padding:12px 0;border-bottom:1px solid #e1e8f0"><b>'+esc(m.sender_email)+'</b><small style="display:block;color:#65738b">'+date(m.created_at)+'</small><p style="white-space:pre-wrap;margin:6px 0">'+esc(m.message)+'</p></article>').join():'<p class="meta">No messages yet.</p>'}
 await refresh();
 const {data:authData,error:authError}=await db.auth.getUser(),user=authData?.user;
 if(authError||!user||!user.email){authBox.innerHTML='Please <a href="auth.html?redirect='+encodeURIComponent(location.pathname+location.search)+'">sign in or register</a> to post a message. Visitors who are not logged in cannot post.';return}
 authBox.textContent='Posting as '+user.email;form.hidden=false;
 form.addEventListener('submit',async e=>{e.preventDefault();const message=document.getElementById('postMessageText').value.trim(),btn=document.getElementById('postMessageBtn');if(!message){notice.textContent='Enter a message before posting.';return}btn.disabled=true;notice.textContent='Posting…';const {error}=await db.from(table).insert({job_id:jobId,user_id:user.id,sender_email:user.email,message,status:'visible'});btn.disabled=false;if(error){notice.textContent='Message was not posted. Please sign in again and retry.';return}document.getElementById('postMessageText').value='';notice.textContent='Your message was posted.';await refresh()});
}

const canonical='https://tamilancareers.in/private-job-details.html?id='+encodeURIComponent(j.id);let c=document.querySelector('link[rel="canonical"]');if(!c){c=document.createElement('link');c.rel='canonical';document.head.append(c)}c.href=canonical;

const fact=(label,value)=>'<div class="fact"><b>'+label+'</b><span>'+esc(value??'Not specified')+'</span></div>';
host.innerHTML='<h2>'+esc(j.job_title)+'</h2><p class="meta"><b>Employer:</b> '+esc(j.employer_name||'Not specified')+' · <b>Location:</b> '+esc(j.location||'Not specified')+'</p><div class="facts">'+fact('Employment type',j.employment_type)+fact('Workplace',j.workplace_type)+fact('Salary',j.salary_min!=null||j.salary_max!=null?((j.salary_currency||'')+' '+(j.salary_min??'—')+' – '+(j.salary_max??'—')+' / '+(j.salary_period||'')):'Not specified')+fact('Vacancies',j.vacancies)+fact('Education',j.education_level)+fact('Qualification / Subjects',Array.isArray(j.qualification_tags)?j.qualification_tags.join(', '):j.qualification_tags)+fact('Age Limit',j.age_limit)+fact('Age Relaxation',j.age_relaxation)+fact('Experience Requirements',j.experience_requirement)+fact('Experience',j.experience_min!=null||j.experience_max!=null?((j.experience_min??'—')+' – '+(j.experience_max??'—')+' years'):'Not specified')+fact('Application deadline',date(j.application_deadline))+fact('Required skills',j.required_skills)+'</div><div class="desc">'+esc(j.description)+'</div>'+(j.how_to_apply?'<h3>How to Apply</h3><div class="desc">'+esc(j.how_to_apply)+'</div>':'')+(j.additional_info?'<h3>Additional Information</h3><div class="desc">'+esc(j.additional_info)+'</div>':'')+'<div class="actions">'+(apply?'<a href="'+esc(apply)+'" target="_blank" rel="noopener noreferrer">Apply on official site</a>':'')+(site?'<a class="secondary" href="'+esc(site)+'" target="_blank" rel="noopener noreferrer">Employer website</a>':'')+(notice?'<a class="secondary" href="'+esc(notice)+'" target="_blank" rel="noopener noreferrer">Official notification</a>':'')+'</div><p class="notice">Verify the employer, job conditions and application link on the official source before sharing personal information or paying any fee. TAMILAN CAREERS does not guarantee recruitment.</p>'+messagePanel();
