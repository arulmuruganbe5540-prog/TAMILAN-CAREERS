(async()=>{const db=supabase.createClient('https://qkmljuuusfjowexvybvy.supabase.co','sb_publishable_Wi6gltM_xFm1m4Dlgq727Q_83Rn58y2'),id=new URLSearchParams(location.search).get('id'),status=document.getElementById('status'),host=document.getElementById('job');
