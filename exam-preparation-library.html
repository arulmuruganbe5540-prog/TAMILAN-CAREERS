<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Exam Preparation Library | TAMILAN CAREERS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{color-scheme:dark;--bg:#071426;--panel:#10243d;--line:#244362;--cyan:#65d7ff;--muted:#a8bed2;--blue:#087fbd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eff7ff;font:15px Arial,sans-serif}.top{padding:16px 20px;background:#0d2036;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{color:var(--cyan);font-weight:800}.wrap{max-width:1100px;margin:auto;padding:22px}.muted{color:var(--muted);line-height:1.5}a{color:var(--cyan)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,select{width:100%;padding:11px;background:#071426;border:1px solid var(--line);border-radius:8px;color:#fff}label{display:block;color:var(--muted);margin:8px 0 5px}.status{padding:11px;background:#183b55;border-radius:8px;margin:12px 0}.card{border:1px solid var(--line);border-radius:10px;padding:15px;margin:12px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:18px;padding:3px 8px;margin:2px;font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}button{background:var(--blue);color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}</style><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5514219463771418"

</head><body><header class="top"><div class="brand">TAMILAN CAREERS</div><a href="index.html">Back to Home</a></header><main class="wrap"><h1>Exam Preparation Library</h1><p class="muted">Browse verified syllabus documents, previous-year papers, study notes, books, mock tests, question banks and exam patterns.</p><div id="status" class="status">Loading verified resources...</div><section class="panel"><div class="grid"><div><label>Search</label><input id="search" placeholder="Search title, exam or subject..."></div><div><label>Resource Type</label><select id="type"><option value="">All Types</option><option value="syllabus">Syllabus</option><option value="previous_year_paper">Previous Year Paper</option><option value="study_notes">Study Notes</option><option value="book">Book</option><option value="mock_test">Mock Test</option><option value="question_bank">Question Bank</option><option value="exam_pattern">Exam Pattern</option><option value="other">Other</option></select></div><div><label>Education Level</label><select id="qualification"><option value="">All Qualifications</option><option>8th Pass</option><option>10th Pass</option><option>12th Pass</option><option>ITI</option><option>Diploma</option><option>Degree</option><option>Postgraduate</option><option>Studying</option></select></div></div></section><section class="panel"><div class="row"><h2>Verified Resources</h2><span id="count" class="muted">0 resources</span></div><div id="results"></div><div class="row"><span id="pageInfo" class="muted"></span><div><button id="prev">Previous</button> <button id="next">Next</button></div></div></section></main><script>(()=>{const sb=window.supabase.createClient('https://qkmljuuusfjowexvybvy.supabase.co','sb_publishable_Wi6gltM_xFm1m4Dlgq727Q_83Rn58y2'),$=id=>document.getElementById(id),SIZE=10;let data=[],page=0;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=$('search').value.toLowerCase().trim(),t=$('type').value,qual=$('qualification').value,rows=data.filter(x=>(!t||x.resource_type===t)&&(!qual||(x.qualification_levels||[]).includes(qual))&&(!q||[x.title,x.exam_name,x.subject,x.description].join(' ').toLowerCase().includes(q))),pages=Math.max(1,Math.ceil(rows.length/SIZE));page=Math.min(page,pages-1);const part=rows.slice(page*SIZE,(page+1)*SIZE);$('results').innerHTML=part.length?part.map(x=>'<article class="card"><h3>'+esc(x.title)+'</h3><p class="muted">'+esc(x.resource_type)+' · '+esc(x.exam_name||'General Preparation')+' · '+esc(x.publication_year||'')+'</p><p>'+esc(x.description||'')+'</p><div>'+(x.qualification_levels||[]).map(q=>'<span class="tag">'+esc(q)+'</span>').join('')+'</div><p>'+(x.is_free?'<span class="tag">Free</span>':'<span class="tag">External / Paid</span>')+'</p><p><a href="'+esc(x.resource_url)+'" target="_blank" rel="noopener">Open Resource</a>　'+(x.source_url?'<a href="'+esc(x.source_url)+'" target="_blank" rel="noopener">Source</a>':'')+'</p></article>').join(''):'<p class="muted">No verified resources match these filters.</p>';$('count').textContent=rows.length+' resources';$('pageInfo').textContent='Page '+(page+1)+' of '+pages;$('prev').disabled=page===0;$('next').disabled=page>=pages-1}async function load(){const {data:d,error}=await sb.from('exam_preparation_library').select('*').eq('is_active',true).eq('verification_status','verified').order('created_at',{ascending:false});if(error){$('status').textContent='Unable to load resources: '+error.message;return}data=d||[];$('status').textContent='Loaded '+data.length+' verified resources.';render()}for(const id of ['search','type','qualification'])$(id).addEventListener(id==='search'?'input':'change',()=>{page=0;render()});$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};load()})();</script></body></html>
