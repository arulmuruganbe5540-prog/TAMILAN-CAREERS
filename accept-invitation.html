<script>
const db=window.supabase.createClient("https://qkmljuuusfjowexvybvy.supabase.co","sb_publishable_Wi6gltM_xFm1m4Dlgq727Q_83Rn58y2");
const token=new URLSearchParams(location.search).get("token")||"",status=document.getElementById("status"),btn=document.getElementById("acceptBtn");
function msg(s,ok=false){status.textContent=s;status.className="status "+(ok?"ok":"err")}
async function init(){if(!token){btn.disabled=true;msg("அழைப்பு Token கிடைக்கவில்லை. Email-ல் வந்த முழு இணைப்பைப் பயன்படுத்தவும்.");return}

if(!data.session.user.email_confirmed_at){btn.disabled=true;msg("உங்கள் Email இன்னும் உறுதிப்படுத்தப்படவில்லை. முதலில் Email உறுதிப்படுத்தலை முடிக்கவும்.");return}
btn.disabled=false}
btn.addEventListener("click",async()=>{btn.disabled=true;btn.textContent="சரிபார்க்கப்படுகிறது...";try{const {data,error}=await db.functions.invoke("company-members",{body:{action:"accept_invitation",invitation_token:token}});if(error)throw new Error(data?.error||error.message);if(data?.error)throw new Error(data.error);msg("நிறுவன அழைப்பு ஏற்கப்பட்டது. இப்போது உங்கள் நிறுவன அனுமதி செயல்படும்.",true);btn.style.display="none";document.getElementById("dashboard").style.display="block"}catch(e){msg(e.message||"அழைப்பை ஏற்க முடியவில்லை.")}finally{btn.disabled=false;btn.textContent="அழைப்பை ஏற்கவும்"}});
init().catch(e=>msg(e.message||String(e)));
</script>  <script src="assets/site-protection.js" defer></script>
