    if(normalizedType) posting.employmentType=normalizedType;
    if(loc && countryName) {
      posting.jobLocation={"@type":"Place","address":{"@type":"PostalAddress","addressLocality":String(loc),"addressCountry":String(countryName)}};
    }
    if(isRemote) {
      posting.jobLocationType="TELECOMMUTE";
      posting.applicantLocationRequirements={"@type":"Country","name":String(countryName)};
    }
    const low=Number(min),high=Number(max);
    const currencyCode=String(pick(j,["salary_currency"])||"").trim().toUpperCase();
    if(((Number.isFinite(low)&&low>0)||(Number.isFinite(high)&&high>0)) && /^[A-Z]{3}$/.test(currencyCode)) {
      const value={"@type":"QuantitativeValue","unitText":period==="yearly"?"YEAR":period==="daily"?"DAY":period==="hourly"?"HOUR":"MONTH"};
      if(Number.isFinite(low)&&low>0)value.minValue=low;
      if(Number.isFinite(high)&&high>0)value.maxValue=high;
      posting.baseSalary={"@type":"MonetaryAmount","currency":currencyCode,"value":value};
    }
    const ld=document.createElement("script");
    ld.type="application/ld+json";ld.id="tc-jobposting-jsonld";
    ld.textContent=JSON.stringify(posting);
    document.head.appendChild(ld);
  }
  async function share(){const u=location.href;if(navigator.share){try{await navigator.share({title,text:"TAMILAN CAREERS Employment: "+title,url:u})}catch(e){}}else{try{await navigator.clipboard.writeText(u);alert("Link copied")}catch(e){alert(u)}}}
  document.getElementById("share").addEventListener("click",share);document.getElementById("share2").addEventListener("click",share);
  const save=document.getElementById("save"),key="tc_saved_jobs_v1";let saved=[];try{saved=JSON.parse(localStorage.getItem(key)||"[]");if(!Array.isArray(saved))saved=[]}catch(e){}
  const exists=()=>saved.some(x=>String(x.id)===String(id));if(exists()){save.textContent="✓ Saved";save.disabled=true}
  save.addEventListener("click",()=>{if(exists())return;saved.push({id,title,company,location:loc,type,savedAt:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(saved));save.textContent="✓ Saved";save.disabled=true});
 }
 show();
