<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Reset | TAMILAN CAREERS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#101d3a,#1765a5);font-family:Arial,"Noto Sans Tamil",sans-serif;color:#172b4d}.card{width:100%;max-width:440px;background:#fff;border-radius:18px;padding:30px;box-shadow:0 15px 45px #0004}.logo{text-align:center;color:#147bd1;font-size:24px;font-weight:bold}.sub{text-align:center;color:#778397;margin:10px 0 24px;line-height:1.6}label{display:block;font-weight:bold;font-size:14px;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d7deea;border-radius:8px;font-size:15px}.wrap{position:relative}.wrap input{padding-right:78px}.toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#eef5fc;color:#126cc1;padding:8px;border-radius:6px;font-weight:bold}.main{width:100%;padding:14px;margin-top:20px;background:#1688ed;color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:bold}.msg{display:none;margin-top:14px;padding:12px;border-radius:8px;line-height:1.6;font-size:14px}.back{text-align:center;margin-top:20px}.back a{color:#147bd1;text-decoration:none}
</style></head><body><main class="card"><div class="logo">TAMILAN CAREERS</div><p class="sub">புதிய Password அமைக்கவும்</p><form id="resetForm">
<label for="newPassword">புதிய Password</label><div class="wrap"><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="குறைந்தது 8 எழுத்துகள்"><button class="toggle" type="button" onclick="toggle('newPassword',this)">காட்டு</button></div>
<label for="confirmPassword">Password உறுதிப்படுத்தவும்</label><div class="wrap"><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="மீண்டும் உள்ளிடவும்"><button class="toggle" type="button" onclick="toggle('confirmPassword',this)">காட்டு</button></div>
<button class="main" id="saveBtn" type="submit">Password மாற்றவும்</button></form><div class="msg" id="msg" role="status" aria-live="polite"></div><div class="back"><a href="login.html">← Login பக்கத்திற்குச் செல்லுங்கள்</a></div></main>
<script>
const client=window.supabase.createClient("https://qkmljuuusfjowexvybvy.supabase.co","sb_publishable_Wi6gltM_xFm1m4Dlgq727Q_83Rn58y2");
function toggle(id,btn){const f=document.getElementById(id);f.type=f.type==="password"?"text":"password";btn.textContent=f.type==="password"?"காட்டு":"மறை";}
function message(t,ok=false){const m=document.getElementById("msg");m.textContent=t;m.style.display="block";m.style.background=ok?"#e7f8ed":"#fff0f0";m.style.color=ok?"#16743b":"#b42318";}
let recoveryReady=false;
client.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session)recoveryReady=true;});
(async()=>{const {data}=await client.auth.getSession();if(data.session)recoveryReady=true;})();
document.getElementById("resetForm").addEventListener("submit",async e=>{
e.preventDefault();const p=document.getElementById("newPassword").value;const cp=document.getElementById("confirmPassword").value;const b=document.getElementById("saveBtn");
if(p.length<8||!/[a-z]/.test(p)||!/[A-Z]/.test(p)||!/\d/.test(p)){message("குறைந்தது 8 எழுத்துகள், ஒரு பெரிய எழுத்து, ஒரு சிறிய எழுத்து, ஒரு எண் சேர்க்கவும்.");return;}
if(p!==cp){message("இரண்டு Password-களும் ஒன்றாக இல்லை.");return;}
b.disabled=true;b.textContent="சேமிக்கப்படுகிறது...";
try{const {data:sd}=await client.auth.getSession();if(!sd.session&&!recoveryReady)throw new Error("இந்த Reset இணைப்பு செல்லுபடியாகவில்லை அல்லது காலாவதியாகிவிட்டது. Login பக்கத்தில் மீண்டும் Forgot Password தேர்வு செய்யவும்.");const {error}=await client.auth.updateUser({password:p});if(error)throw error;message("Password வெற்றிகரமாக மாற்றப்பட்டது. பாதுகாப்புக்காக மீண்டும் Login செய்யுங்கள்.",true);await client.auth.signOut();setTimeout(()=>location.replace("login.html"),1800);}catch(err){message(err.message||"Password மாற்ற முடியவில்லை.");}finally{b.disabled=false;b.textContent="Password மாற்றவும்";}
});
</script></body></html>
