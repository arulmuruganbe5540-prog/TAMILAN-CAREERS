function displayEnglish(value, fallback = "") {
 let text = String(value ?? "");
 for (const [source, translated] of legacyNotificationTranslations) text = text.split(source).join(translated);
 if (Array.from(text).some(ch => /\p{L}/u.test(ch) && !/\p{Script=Latin}/u.test(ch))) return fallback;
 return text;
}
