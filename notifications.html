<!DOCTYPE html>
<html lang="en"><head>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d3a"><title>Notifications & Interviews | TAMILAN CAREERS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:#18243a;font-family:Arial,"Noto Sans Tamil",sans-serif;line-height:1.65}header{background:#101d3a;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:21px;font-weight:800;color:#55caff}.brand span{color:#fff}nav{display:flex;gap:8px;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;background:#ffffff18;padding:8px 11px;border-radius:8px;font-size:13px}main{max-width:900px;margin:25px auto;padding:0 15px}.hero{background:linear-gradient(120deg,#101d3a,#1765a5);color:#fff;padding:22px;border-radius:15px;margin-bottom:16px}.hero h1{margin:0 0 6px}.panel,.item{background:#fff;border:1px solid #e1e9f2;border-radius:13px;padding:17px;margin:12px 0}.muted{color:#68788d;font-size:13px}.item.unread{border-left:4px solid #1688ed}.pill{display:inline-block;padding:4px 10px;border-radius:20px;background:#edf5fc;color:#245781;font-size:12px}.btn{border:0;border-radius:8px;padding:9px 13px;background:#1688ed;color:#fff;font-weight:700;cursor:pointer;margin:5px 5px 0 0}.btn.alt{background:#e8eef6;color:#24415f}.btn:disabled{opacity:.55}.letter{white-space:pre-wrap;background:#f7f9fc;border:1px solid #e5ebf3;border-radius:9px;padding:12px;margin:10px 0}.error{background:#fff0ef;color:#9b302b;padding:12px;border-radius:9px}.empty{text-align:center;padding:25px;color:#68788d;background:#fff;border-radius:12px}
</style>  <link rel="stylesheet" href="assets/site-protection.css">
<style>
/* Consistent premium text-only site identity */
.tc-domain-brand{display:inline-block!important;color:#eaf8ff!important;font-size:clamp(13px,2vw,19px)!important;font-weight:900!important;letter-spacing:.8px!important;line-height:1.2!important;white-space:nowrap!important;text-decoration:none!important;text-shadow:0 1px 10px rgba(72,190,255,.16)}
@media(max-width:480px){.tc-domain-brand{font-size:12px!important;letter-spacing:.35px!important}}
</style></head><body><header><div class="brand"><span class="tc-domain-brand">WWW.TAMILANCAREERS.IN</span></div><nav><a href="dashboard.html">Dashboard</a><a href="my-applications.html">My Applications</a></nav></header>
<main><section class="hero"><h1>🔔 Notifications & Interview Invitations</h1><p>View job application updates, interview invitations and your responses here.</p></section><div id="summary" class="panel">Loading notifications...</div><section id="interviews"></section><section id="notifications"></section></main>
<script>
const db=window.supabase.createClient("https://qkmljuuusfjowexvybvy.supabase.co","sb_publishable_Wi6gltM_xFm1m4Dlgq727Q_83Rn58y2");
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const typeText={application_status:"Application Status",interview_invitation:"Interview Invitation",interview_response:"Interview Response",interview_reminder:"Interview Reminder",system:"Notification"};
const modeText={in_person:"In Person",online:"Online",phone:"Phone"};
async function init(){
 const {data:s,error:se}=await db.auth.getSession(),user=s.session?.user;
 if(se||!user){location.replace("login.html?next="+encodeURIComponent("notifications.html"));return}
 const [nr,ir]=await Promise.all([
  db.from("tc_notifications").select("id,notification_type,title,body,related_application_id,related_interview_id,is_read,created_at").eq("user_id",user.id).order("created_at",{ascending:false}).limit(100),
  db.from("tc_interview_invitations").select("id,application_id,scheduled_at,interview_mode,location_or_link,letter_text,status,candidate_response_at,created_at,jobs:job_applications(job_id,jobs(job_title)),companies(company_name)").order("scheduled_at",{ascending:true})
 ]);
 if(nr.error){$("summary").className="error";$("summary").textContent="Unable to load notifications. Check whether supabase-interview-notifications.sql has been run. "+nr.error.message;return}
 const notes=nr.data||[],invs=ir.data||[];
 $("summary").textContent="Total notifications: "+notes.length+" · Unread: "+notes.filter(n=>!n.is_read).length+(ir.error?" · Unable to load interview list: "+ir.error.message:"");
 const candidateRole=await db.from("user_roles").select("role").eq("user_id",user.id).maybeSingle();
 const isCandidate=candidateRole.data?.role==="job_seeker";
 const active=invs.filter(i=>i.status==="pending"||i.status==="accepted");
 $("interviews").innerHTML=active.length?'<h2>Interview Invitations</h2>'+active.map(i=>{
  const rel=Array.isArray(i.jobs)?i.jobs[0]:i.jobs,job=Array.isArray(rel?.jobs)?rel.jobs[0]:rel?.jobs,co=Array.isArray(i.companies)?i.companies[0]:i.companies;
  return '<article class="item"><h3>'+esc(job?.job_title||"Job")+'</h3><div><b>Company:</b> '+esc(co?.company_name||"Company")+'</div><div><b>Date:</b> '+esc(new Date(i.scheduled_at).toLocaleString("en-IN"))+'</div><div><b>Type:</b> '+esc(modeText[i.interview_mode]||i.interview_mode)+'</div>'+(i.location_or_link?'<div><b>Location / Link:</b> '+esc(i.location_or_link)+'</div>':"")+(i.letter_text?'<div class="letter">'+esc(i.letter_text)+'</div>':"")+'<span class="pill">'+esc(i.status==="pending"?"Response required":i.status==="accepted"?"Accepted":i.status)+'</span>'+(isCandidate&&i.status==="pending"?'<div><button class="btn" data-response="accepted" data-id="'+esc(i.id)+'">ஏற்றுக்கொள்கிறேன்</button><button class="btn alt" data-response="declined" data-id="'+esc(i.id)+'">வர முடியாது</button></div>':"")+'</article>';
 }).join(""):'<h2>Interview Invitations</h2><div class="empty">There are no pending interview invitations.</div>';
 $("notifications").innerHTML='<h2>All Notifications</h2><div class="panel"><button class="btn alt" id="markAll">Mark All as Read</button></div>'+(notes.length?notes.map(n=>'<article class="item '+(!n.is_read?'unread':'')+'"><span class="pill">'+esc(typeText[n.notification_type]||"Notification")+'</span> <span class="muted">'+esc(new Date(n.created_at).toLocaleString("en-IN"))+'</span><h3>'+esc(n.title)+'</h3><p>'+esc(n.body)+'</p>'+(!n.is_read?'<button class="btn alt" data-read="'+esc(n.id)+'">Mark as Read</button>': '<span class="muted">Read</span>')+(n.related_application_id?'<a class="btn alt" href="my-applications.html">விண்ணப்பத்தைப் பார்க்க</a>':"")+'</article>').join(""):'<div class="empty">இன்னும் Notificationகள் இல்லை.</div>');

}
 $("notifications").addEventListener("click",async e=>{
  const read=e.target.closest("[data-read]"),all=e.target.closest("#markAll");
  if(read){read.disabled=true;const {error}=await db.rpc("tc_mark_notification_read",{p_notification_id:read.dataset.read});if(error){read.disabled=false;alert("Error: "+error.message);return}await init()}
  if(all){all.disabled=true;const {error}=await db.rpc("tc_mark_all_notifications_read");if(error){all.disabled=false;alert("Error: "+error.message);return}await init()}
 });
 $("interviews").addEventListener("click",async e=>{
  const b=e.target.closest("[data-response]");if(!b)return;
  const label=b.textContent;b.disabled=true;b.textContent="Saving...";
  const {error}=await db.rpc("tc_respond_interview_invitation",{p_interview_id:b.dataset.id,p_response:b.dataset.response});
  if(error){b.disabled=false;b.textContent=label;alert("Unable to save response: "+error.message);return}
  await init();
 });
init();
</script>  <script src="assets/site-protection.js" defer></script>
</body></html>
