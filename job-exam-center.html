function renderResources(items){if(!items.length)return '<div class="empty">இந்த வேலைக்கான சரிபார்க்கப்பட்ட கூடுதல் கோப்புகள்/இணைப்புகள் இன்னும் சேர்க்கப்படவில்லை. அதிகாரப்பூர்வ அறிவிப்புகள் கிடைத்ததும் இங்கே சேர்க்கப்படும்.</div>';return items.map(x=>'<article class="resource"><h3>'+esc(x.title)+'</h3><div class="muted">'+esc(types[x.resource_type]||x.resource_type)+(x.resource_year?' · '+x.resource_year:'')+(x.exam_stage?' · '+esc(x.exam_stage):'')+(x.is_official?' · அதிகாரப்பூர்வம்':'')+'</div>'+(x.description?'<p>'+esc(x.description)+'</p>':'')+link(x.resource_url,"திறக்கவும்")+'</article>').join("");}
function renderNotices(items){if(!items.length)return '<div class="empty">இந்த வேலைக்கு பொருந்தும் வெளியிடப்பட்ட Hall Ticket / Exam Date / Answer Key / Result பதிவுகள் தற்போது இல்லை.</div>';return items.map(n=>{const cat=categories[n.category]||"job";return '<article class="resource"><h3>'+esc(n.title)+'</h3><div class="muted"><span class="pill">'+esc(cat==="result"?"தேர்வு முடிவு":cat==="answer_key"?"Answer Key":cat==="admit_card"?"Hall Ticket":cat==="exam_update"?"தேர்வு புதுப்பிப்பு":"அறிவிப்பு")+'</span> '+date(n.notice_date)+'</div>'+(n.eligibility_summary?'<p>'+esc(n.eligibility_summary)+'</p>':'')+link(n.official_url,"அதிகாரப்பூர்வ தகவல்")+' <a class="btn secondary" href="government-notice-details.html?id='+encodeURIComponent(n.id)+'">முழு விவரம்</a></article>'}).join("");}
function showTest(set){currentSet=set;answers={};$("test").innerHTML='<div class="notice">'+esc(set.disclaimer||"AI உருவாக்கிய பயிற்சி வினாத்தாள் மட்டுமே; அதிகாரப்பூர்வ வினாத்தாள் அல்ல.")+'</div><h2>'+esc(set.title)+'</h2><p class="muted">'+set.question_count+' கேள்விகள் · ஒவ்வொரு கேள்விக்கும் ஒரு சரியான விடை</p>'+set.questions.map((q,i)=>'<div class="question" id="q'+i+'"><b>'+(i+1)+'. '+esc(q.question)+'</b>'+(q.options||[]).map((o,k)=>'<label class="option"><input type="radio" name="q'+i+'" value="'+k+'" onchange="answers['+i+']='+k+'"> '+String.fromCharCode(65+k)+'. '+esc(o)+'</label>').join('')+'<div class="muted">'+esc(q.topic||"")+'</div></div>').join('')+'<button class="btn" id="submitTest">விடைகளைச் சமர்ப்பித்து மதிப்பெண் பார்க்க</button><div id="scoreBox"></div>';
$("submitTest").onclick=finishTest;}
async function finishTest(){let score=0;currentSet.questions.forEach((q,i)=>{if(Number(answers[i])===Number(q.correct_index))score++;const node=$("q"+i);node.querySelectorAll(".option").forEach((o,k)=>{if(k===Number(q.correct_index))o.classList.add("correct");else if(k===Number(answers[i]))o.classList.add("wrong");});const exp=document.createElement("p");exp.className="muted";exp.textContent="விளக்கம்: "+(q.explanation||"");node.appendChild(exp);});$("scoreBox").innerHTML='<p class="result">உங்கள் மதிப்பெண்: '+score+' / '+currentSet.questions.length+'</p><p class="muted">இது பயிற்சித் தேர்வு மதிப்பெண் மட்டுமே; அதிகாரப்பூர்வ தேர்வு மதிப்பெண் அல்ல.</p>';$("submitTest").disabled=true;}
function detectTopics(job){const s=[job.job_title,job.recruitment_authority,job.employer_name,job.description].filter(Boolean).join(" ").toLowerCase();const topics=["math","reason","general","science","computer"];if(/railway|ரயில்வே|rrb|ரயில்/.test(s))topics.push("railway");if(/police|காவல்|constable|si\b/.test(s))topics.push("police");if(/teacher|teaching|ஆசிரியர்|பள்ளி|கல்வி/.test(s))topics.push("teaching");if(/medical|nurse|doctor|health|மருத்துவ|செவிலியர்/.test(s))topics.push("medical");return topics;}
function generate(){const count=Math.min(Number($("count").value)||15,QUESTION_BANK.length);const topics=detectTopics(window.currentJob||{});let pool=QUESTION_BANK.filter(q=>topics.includes(q.topic));if(pool.length<count){const extra=QUESTION_BANK.filter(q=>!pool.includes(q));pool=pool.concat(extra);}pool=pool.sort(()=>Math.random()-.5).slice(0,count);const set={id:null,title:(window.currentJob?.job_title||"அரசு வேலை")+" — மாதிரித் தேர்வு",question_count:pool.length,questions:pool,disclaimer:"OpenAI அல்லது வேறு கட்டண AI சேவை பயன்படுத்தப்படவில்லை. முன்பே சரிபார்த்து சேர்க்கப்பட்ட கேள்வி வங்கியிலிருந்து தானாகத் தேர்ந்தெடுக்கப்பட்ட பயிற்சி வினாத்தாள். இது அதிகாரப்பூர்வ வினாத்தாள் அல்ல."};showTest(set);}
async function init(){if(!jobId){$("root").textContent="வேலை ID கிடைக்கவில்லை.";return;}const {data:job,error}=await db.from("jobs").select("*").eq("id",jobId).eq("status","published").maybeSingle();if(error||!job){$("root").textContent="வேலை விவரம் கிடைக்கவில்லை.";return;}if(job.job_kind!=="government"){$("root").textContent="இந்த தேர்வு தயாரிப்பு வசதி தற்போது அரசுப் பணிகளுக்காக அமைக்கப்பட்டுள்ளது.";return;}
window.currentJob=job;const title=job.job_title||"அரசு வேலை";const {data:resources}=await db.from("job_exam_resources").select("*").eq("job_id",jobId).eq("status","published").order("resource_year",{ascending:false});
const {data:allNotices}=await db.from("government_notices").select("*").eq("is_active",true).order("notice_date",{ascending:false}).limit(500);
const keywords=[job.job_title,job.recruitment_authority,job.notification_number,job.description].filter(Boolean).join(" ").toLowerCase().split(/[^a-z0-9அ-ஹ]+/).filter(x=>x.length>2);
const notices=(allNotices||[]).filter(n=>{const d=n.details||{},hay=[n.title,n.notice_reference,n.eligibility_summary,d.department,d.recruitment_authority,d.post_names,d.exam_name,d.job_title].filter(Boolean).join(" ").toLowerCase();return keywords.some(k=>hay.includes(k));}).slice(0,40);
$("root").className="";$("root").innerHTML='<section class="hero"><div class="muted" style="color:#b9dcff">TAMILAN CAREERS · EXAM PREPARATION CENTRE</div><h1>'+esc(title)+'</h1><p>'+esc(job.recruitment_authority||job.employer_name||"அரசுத் துறை")+' · '+esc(job.notification_number||"அறிவிப்பு எண் குறிப்பிடப்படவில்லை")+'</p><p>இந்த வேலைக்கான தேர்வு வழிமுறை, பாடத்திட்டம், மாதிரித் தேர்வு மற்றும் அதிகாரப்பூர்வ தேர்வு புதுப்பிப்புகள்.</p></section><section class="panel"><h2>1. தேர்வு வழிமுறை & பாடத்திட்டம்</h2><p>'+esc(job.selection_process||"அதிகாரப்பூர்வ அறிவிப்பில் குறிப்பிடப்பட்டுள்ள தேர்வு கட்டங்களைப் பின்பற்றவும். துல்லியமான தேர்வு முறை அறிவிப்பு PDF-ஐப் பொறுத்தது.")+'</p>'+renderResources((resources||[]).filter(x=>x.resource_type==="syllabus"||x.resource_type==="official_notice"))+link(job.official_notification_url,"அதிகாரப்பூர்வ வேலை அறிவிப்பு")+'</section><section class="panel"><h2>2. தானியங்கி மாதிரித் தேர்வு</h2><div class="notice">OpenAI/API கட்டணம் தேவையில்லை. வேலைத் துறைக்கு ஏற்ற தலைப்புகளிலிருந்து கேள்வி வங்கி மூலம் வினாக்கள் தானாகத் தேர்ந்தெடுக்கப்படும். இது பயிற்சிக்கான வினாத்தாள் மட்டுமே; அதிகாரப்பூர்வ வினாத்தாள் அல்ல.</div><div class="toolbar" style="margin:12px 0"><label>கேள்விகள் <select id="count"><option value="10">10</option><option value="15" selected>15</option><option value="25">25</option></select></label><button class="btn" id="generate">மாதிரித் தேர்வைத் தொடங்கு</button></div><div id="test"><div class="empty">Login இல்லாமலேயே மாதிரித் தேர்வைத் தொடங்கலாம். கேள்விகள் தானாகத் தேர்ந்தெடுக்கப்படும்.</div></div></section><section class="panel"><h2>3. பழைய வினாத்தாள்கள் & அதிகாரப்பூர்வ Mock Test</h2>'+renderResources((resources||[]).filter(x=>["previous_paper","mock_test"].includes(x.resource_type)))+'</section><section class="panel"><h2>4. Hall Ticket · Exam Date · Answer Key · Result</h2>'+renderNotices(notices)+'</section><section class="panel"><h2>5. Document Verification · Medical · Cut-off</h2>'+renderResources((resources||[]).filter(x=>["cutoff","result","other","exam_schedule","hall_ticket","answer_key","admit_card"].includes(x.resource_type)))+'</section>';
$("generate").onclick=generate;
}
init();
</script></body></html>
