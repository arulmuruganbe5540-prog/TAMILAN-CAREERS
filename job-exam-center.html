</style></head><body><header><a class="brand" href="index.html">TAMILAN CAREERS</a><nav><a href="jobs.html">வேலை தேடல்</a><a href="indian-government-jobs.html">அரசுத் துறைகள்</a><a href="dashboard.html">Dashboard</a></nav></header><main><div id="root" class="empty">தேர்வு தகவல்கள் ஏற்றப்படுகின்றன…</div></main>
<script>
const db=window.supabase.createClient("https://qkmljuuusfjowexvybvy.supabase.co","sb_publishable_Wi6gltM_xFm1m4Dlgq727Q_83Rn58y2");
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const params=new URLSearchParams(location.search),jobId=params.get("job_id");let currentSet=null,answers={};
const types={syllabus:"பாடத்திட்டம்",previous_paper:"பழைய வினாத்தாள்",official_notice:"அதிகாரப்பூர்வ அறிவிப்பு",exam_schedule:"தேர்வு அட்டவணை",hall_ticket:"Hall Ticket",answer_key:"Answer Key",result:"தேர்வு முடிவு",cutoff:"Cut-off / Merit List",admit_card:"Admit Card",mock_test:"அதிகாரப்பூர்வ Mock Test",other:"மற்றவை"};
const categories={result:"result",answer_key:"answer_key",admit_card:"admit_card",exam_date:"exam_update",exam_update:"exam_update",job:"job",notification:"job"};
function date(v){if(!v)return "";const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString("ta-IN");}
function link(url,label){return url?'<a class="btn secondary" target="_blank" rel="noopener" href="'+esc(url)+'">'+label+' ↗</a>':"";}
function renderResources(items){if(!items.length)return '<div class="empty">இந்த வேலைக்கான சரிபார்க்கப்பட்ட கூடுதல் கோப்புகள்/இணைப்புகள் இன்னும் சேர்க்கப்படவில்லை. அதிகாரப்பூர்வ அறிவிப்புகள் கிடைத்ததும் இங்கே சேர்க்கப்படும்.</div>';return items.map(x=>'<article class="resource"><h3>'+esc(x.title)+'</h3><div class="muted">'+esc(types[x.resource_type]||x.resource_type)+(x.resource_year?' · '+x.resource_year:'')+(x.exam_stage?' · '+esc(x.exam_stage):'')+(x.is_official?' · அதிகாரப்பூர்வம்':'')+'</div>'+(x.description?'<p>'+esc(x.description)+'</p>':'')+link(x.resource_url,"திறக்கவும்")+'</article>').join("");}
function renderNotices(items){if(!items.length)return '<div class="empty">இந்த வேலைக்கு பொருந்தும் வெளியிடப்பட்ட Hall Ticket / Exam Date / Answer Key / Result பதிவுகள் தற்போது இல்லை.</div>';return items.map(n=>{const cat=categories[n.category]||"job";return '<article class="resource"><h3>'+esc(n.title)+'</h3><div class="muted"><span class="pill">'+esc(cat==="result"?"தேர்வு முடிவு":cat==="answer_key"?"Answer Key":cat==="admit_card"?"Hall Ticket":cat==="exam_update"?"தேர்வு புதுப்பிப்பு":"அறிவிப்பு")+'</span> '+date(n.notice_date)+'</div>'+(n.eligibility_summary?'<p>'+esc(n.eligibility_summary)+'</p>':'')+link(n.official_url,"அதிகாரப்பூர்வ தகவல்")+' <a class="btn secondary" href="government-notice-details.html?id='+encodeURIComponent(n.id)+'">முழு விவரம்</a></article>'}).join("");}
function showTest(set){currentSet=set;answers={};$("test").innerHTML='<div class="notice">'+esc(set.disclaimer||"AI உருவாக்கிய பயிற்சி வினாத்தாள் மட்டுமே; அதிகாரப்பூர்வ வினாத்தாள் அல்ல.")+'</div><h2>'+esc(set.title)+'</h2><p class="muted">'+set.question_count+' கேள்விகள் · ஒவ்வொரு கேள்விக்கும் ஒரு சரியான விடை</p>'+set.questions.map((q,i)=>'<div class="question" id="q'+i+'"><b>'+(i+1)+'. '+esc(q.question)+'</b>'+(q.options||[]).map((o,k)=>'<label class="option"><input type="radio" name="q'+i+'" value="'+k+'" onchange="answers['+i+']='+k+'"> '+String.fromCharCode(65+k)+'. '+esc(o)+'</label>').join('')+'<div class="muted">'+esc(q.topic||"")+'</div></div>').join('')+'<button class="btn" id="submitTest">விடைகளைச் சமர்ப்பித்து மதிப்பெண் பார்க்க</button><div id="scoreBox"></div>';
$("submitTest").onclick=finishTest;}
async function finishTest(){let score=0;currentSet.questions.forEach((q,i)=>{if(Number(answers[i])===Number(q.correct_index))score++;const node=$("q"+i);node.querySelectorAll(".option").forEach((o,k)=>{if(k===Number(q.correct_index))o.classList.add("correct");else if(k===Number(answers[i]))o.classList.add("wrong");});const exp=document.createElement("p");exp.className="muted";exp.textContent="விளக்கம்: "+(q.explanation||"");node.appendChild(exp);});$("scoreBox").innerHTML='<p class="result">உங்கள் மதிப்பெண்: '+score+' / '+currentSet.questions.length+'</p><p class="muted">இது பயிற்சித் தேர்வு மதிப்பெண் மட்டுமே; அதிகாரப்பூர்வ தேர்வு மதிப்பெண் அல்ல.</p>';try{const {data:{user}}=await db.auth.getUser();if(user)await db.from("job_exam_attempts").insert({question_set_id:currentSet.id,job_id:jobId,user_id:user.id,answers,score,total_questions:currentSet.questions.length});}catch(e){}$("submitTest").disabled=true;}
async function generate(){const btn=$("generate");btn.disabled=true;btn.textContent="AI வினாத்தாள் உருவாக்குகிறது…";$("test").innerHTML='<div class="empty">உங்கள் வேலை மற்றும் பாடத்திட்டத்திற்கு ஏற்ற புதிய பயிற்சி வினாக்கள் உருவாக்கப்படுகின்றன. சிறிது நேரம் ஆகலாம்.</div>';try{const {data:{session}}=await db.auth.getSession();if(!session){location.href="login.html?next="+encodeURIComponent(location.pathname+location.search);return;}const {data,error}=await db.functions.invoke("generate-job-mock-exam",{body:{job_id:jobId,question_count:Number($("count").value),difficulty:$("difficulty").value,language:"ta"}});if(error)throw error;if(data?.error)throw new Error(data.error);showTest(data.question_set);}catch(e){$("test").innerHTML='<div class="notice">'+esc(e.message||"வினாத்தாள் உருவாக்க முடியவில்லை. மீண்டும் முயற்சிக்கவும்.")+'</div>';}finally{btn.disabled=false;btn.textContent="புதிய AI மாதிரித் தேர்வு உருவாக்கு";}}
async function init(){if(!jobId){$("root").textContent="வேலை ID கிடைக்கவில்லை.";return;}const {data:job,error}=await db.from("jobs").select("*").eq("id",jobId).eq("status","published").maybeSingle();if(error||!job){$("root").textContent="வேலை விவரம் கிடைக்கவில்லை.";return;}if(job.job_kind!=="government"){$("root").textContent="இந்த தேர்வு தயாரிப்பு வசதி தற்போது அரசுப் பணிகளுக்காக அமைக்கப்பட்டுள்ளது.";return;}
const title=job.job_title||"அரசு வேலை";const {data:resources}=await db.from("job_exam_resources").select("*").eq("job_id",jobId).eq("status","published").order("resource_year",{ascending:false});
const {data:allNotices}=await db.from("government_notices").select("*").eq("is_active",true).order("notice_date",{ascending:false}).limit(500);
const keywords=[job.job_title,job.recruitment_authority,job.notification_number,job.description].filter(Boolean).join(" ").toLowerCase().split(/[^a-z0-9அ-ஹ]+/).filter(x=>x.length>2);
const notices=(allNotices||[]).filter(n=>{const d=n.details||{},hay=[n.title,n.notice_reference,n.eligibility_summary,d.department,d.recruitment_authority,d.post_names,d.exam_name,d.job_title].filter(Boolean).join(" ").toLowerCase();return keywords.some(k=>hay.includes(k));}).slice(0,40);
$("root").className="";$("root").innerHTML='<section class="hero"><div class="muted" style="color:#b9dcff">TAMILAN CAREERS · EXAM PREPARATION CENTRE</div><h1>'+esc(title)+'</h1><p>'+esc(job.recruitment_authority||job.employer_name||"அரசுத் துறை")+' · '+esc(job.notification_number||"அறிவிப்பு எண் குறிப்பிடப்படவில்லை")+'</p><p>இந்த வேலைக்கான தேர்வு வழிமுறை, பாடத்திட்டம், மாதிரித் தேர்வு மற்றும் அதிகாரப்பூர்வ தேர்வு புதுப்பிப்புகள்.</p></section><section class="panel"><h2>1. தேர்வு வழிமுறை & பாடத்திட்டம்</h2><p>'+esc(job.selection_process||"அதிகாரப்பூர்வ அறிவிப்பில் குறிப்பிடப்பட்டுள்ள தேர்வு கட்டங்களைப் பின்பற்றவும். துல்லியமான தேர்வு முறை அறிவிப்பு PDF-ஐப் பொறுத்தது.")+'</p>'+renderResources((resources||[]).filter(x=>x.resource_type==="syllabus"||x.resource_type==="official_notice"))+link(job.official_notification_url,"அதிகாரப்பூர்வ வேலை அறிவிப்பு")+'</section><section class="panel"><h2>2. AI மாதிரித் தேர்வு</h2><div class="notice">AI உருவாக்கும் வினாக்கள் பயிற்சிக்காக மட்டுமே. அவை அதிகாரப்பூர்வ RRB / அரசு வினாத்தாள்கள் அல்ல. தேர்வின் உண்மையான பாடத்திட்டம் மற்றும் முறை அதிகாரப்பூர்வ அறிவிப்பில் சரிபார்க்கப்பட வேண்டும்.</div><div class="toolbar" style="margin:12px 0"><label>கேள்விகள் <select id="count"><option value="10">10</option><option value="15" selected>15</option><option value="25">25</option><option value="50">50</option></select></label><label>கடினத்தன்மை <select id="difficulty"><option value="mixed">கலப்பு</option><option value="easy">எளிது</option><option value="medium">நடுத்தரம்</option><option value="hard">கடினம்</option></select></label><button class="btn" id="generate">புதிய AI மாதிரித் தேர்வு உருவாக்கு</button></div><div id="test"><div class="empty">தேர்வை உருவாக்க Login தேவை. AI API சேவை இயக்கப்பட்டிருக்க வேண்டும்.</div></div></section><section class="panel"><h2>3. பழைய வினாத்தாள்கள் & அதிகாரப்பூர்வ Mock Test</h2>'+renderResources((resources||[]).filter(x=>["previous_paper","mock_test"].includes(x.resource_type)))+'</section><section class="panel"><h2>4. Hall Ticket · Exam Date · Answer Key · Result</h2>'+renderNotices(notices)+'</section><section class="panel"><h2>5. Document Verification · Medical · Cut-off</h2>'+renderResources((resources||[]).filter(x=>["cutoff","result","other","exam_schedule","hall_ticket","answer_key","admit_card"].includes(x.resource_type)))+'</section>';
$("generate").onclick=generate;
}
init();
</script></body></html>
