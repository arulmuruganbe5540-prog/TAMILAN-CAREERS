<script>
const db=window.supabase.createClient("https://qkmljuuusfjowexvybvy.supabase.co","sb_publishable_Wi6gltM_xFm1m4Dlgq727Q_83Rn58y2");
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const params=new URLSearchParams(location.search),jobId=params.get("job_id");let currentSet=null,answers={};
const QUESTION_BANK = [{"topic":"math","question":"A product costs ₹500. What is the selling price after a 10% discount?","options":["450","460","475","490"],"correct_index":0,"explanation":"10% of 500 = 50; 500 − 50 = 450."},{"topic":"math","question":"What is the least common multiple (LCM) of 12 and 18?","options":["6","24","36","72"],"correct_index":2,"explanation":"The smallest number divisible by both 12 and 18 is 36."},{"topic":"math","question":"A vehicle travels at 60 km/h for 2 hours. What distance does it cover?","options":["30 km","60 km","120 km","180 km"],"correct_index":2,"explanation":"Distance = Speed × Time = 60 × 2 = 120 km."},{"topic":"math","question":"What is 25 percent of 200?","options":["25","40","50","75"],"correct_index":2,"explanation":"200 × 25/100 = 50."},{"topic":"math","question":"If three-fourths of a number is 24, what is the number?","options":["18","24","30","32"],"correct_index":3,"explanation":"24 × 4/3 = 32."},{"topic":"reason","question":"Sequence: 2, 4, 8, 16, __. What is the next number?","options":["18","24","30","32"],"correct_index":3,"explanation":"Each number is multiplied by 2."},{"topic":"reason","question":"Sequence: 5, 10, 15, 20, __. What is the next number?","options":["22","24","25","30"],"correct_index":2,"explanation":"Add 5 each time."},{"topic":"reason","question":"A person facing north turns right. Which direction are they facing?","options":["West","East","South","North"],"correct_index":1,"explanation":"Turning right from north leads east."},{"topic":"reason","question":"All roses are flowers. Which conclusion is correct?","options":["All flowers are roses","Roses are flowers","No flower is a rose","Roses are trees"],"correct_index":1,"explanation":"According to the statement, roses are a type of flower."},{"topic":"reason","question":"What is the next letter in the sequence A, C, E, G, __?","options":["H","I","J","K"],"correct_index":1,"explanation":"One letter is skipped between each letter."},{"topic":"science","question":"What is the chemical formula for water?","options":["CO₂","H₂O","O₂","NaCl"],"correct_index":1,"explanation":"Water consists of two hydrogen atoms and one oxygen atom."},{"topic":"science","question":"Which major organ helps filter waste from human blood?","options":["Heart","Lungs","Kidneys","Stomach"],"correct_index":2,"explanation":"The kidneys filter waste from the blood."},{"topic":"science","question":"Which gas do plants mainly absorb for photosynthesis?","options":["Oxygen","Carbon dioxide","Nitrogen","Hydrogen"],"correct_index":1,"explanation":"Plants use carbon dioxide and water to produce food."},{"topic":"science","question":"What is the SI unit of electric current?","options":["Volt","Watt","Ampere","Ohm"],"correct_index":2,"explanation":"The SI unit of electric current is the ampere."},{"topic":"science","question":"What is the boiling point of water at standard pressure?","options":["0°C","50°C","100°C","150°C"],"correct_index":2,"explanation":"At standard atmospheric pressure, water boils at 100°C."},{"topic":"general","question":"When did the Constitution of India come into effect?","options":["15 August 1947","26 January 1950","2 October 1950","26 November 1949"],"correct_index":1,"explanation":"The Constitution of India came into effect on 26 January 1950."},{"topic":"general","question":"What is the national animal of India?","options":["Lion","Elephant","Bengal Tiger","Leopard"],"correct_index":2,"explanation":"The Bengal tiger is the national animal of India."},{"topic":"general","question":"Who was the first President of India?","options":["Jawaharlal Nehru","Dr. Rajendra Prasad","Sardar Patel","Dr. Ambedkar"],"correct_index":1,"explanation":"Dr. Rajendra Prasad was the first President of India."},{"topic":"general","question":"What is the upper house of the Indian Parliament?","options":["Lok Sabha","Legislative Assembly","Rajya Sabha","Panchayat"],"correct_index":2,"explanation":"The Rajya Sabha is the upper house of the Indian Parliament."},{"topic":"general","question":"What is the currency of India?","options":["Dollar","Rupee","Euro","Yen"],"correct_index":1,"explanation":"The official currency of India is the Indian rupee."},{"topic":"railway","question":"Under which ministry does Indian Railways operate?","options":["Ministry of Road Transport","Ministry of Railways","Ministry of Home Affairs","Ministry of Defence"],"correct_index":1,"explanation":"Indian Railways operates under the Union Ministry of Railways."},{"topic":"railway","question":"What term describes the distance between two railway rails?","options":["Gauge","Voltage","Platform","Signal"],"correct_index":0,"explanation":"The distance between two rails is called the track gauge."},{"topic":"railway","question":"What does a red railway signal generally indicate?","options":["Proceed","Increase speed","Stop","Change track"],"correct_index":2,"explanation":"A red signal indicates stop."},{"topic":"police","question":"What is India's emergency helpline number 112 used for?","options":["Weather","Unified emergency assistance","Railway enquiry","Banking services"],"correct_index":1,"explanation":"112 is India's unified emergency helpline number."},{"topic":"police","question":"Which new law replaced the Indian Penal Code and came into force in 2024?","options":["BNS","BNSS","BSA","RTI"],"correct_index":0,"explanation":"The Bharatiya Nyaya Sanhita (BNS) came into force on 1 July 2024."},{"topic":"teaching","question":"What is emphasised in child-centred learning?","options":["Only the teacher speaks","Active student participation","Only memorisation","Only examinations"],"correct_index":1,"explanation":"Student participation and experience are central to child-centred learning."},{"topic":"teaching","question":"What is the purpose of continuous and comprehensive evaluation?","options":["Only one final exam","Continuously track learning progress","Only record attendance","Only sports"],"correct_index":1,"explanation":"Continuous evaluation monitors different aspects of student development."},{"topic":"medical","question":"Which instrument measures body temperature?","options":["Barometer","Thermometer","Hygrometer","Ammeter"],"correct_index":1,"explanation":"A thermometer is used to measure body temperature."},{"topic":"medical","question":"Which component in blood mainly carries oxygen?","options":["Haemoglobin","Platelets","Plasma only","Insulin"],"correct_index":0,"explanation":"Haemoglobin in red blood cells carries oxygen."},{"topic":"computer","question":"What does CPU stand for?","options":["Central Processing Unit","Computer Personal Unit","Central Program Utility","Control Power Unit"],"correct_index":0,"explanation":"CPU stands for Central Processing Unit."},{"topic":"computer","question":"What does HTTPS indicate in a web address?","options":["A secure HTTP connection","Computer speed","A file type","An email service"],"correct_index":0,"explanation":"HTTPS uses encryption to secure the web connection."}];

const types={syllabus:"Syllabus",previous_paper:"Previous Question Paper",official_notice:"Official Notice",exam_schedule:"Exam Schedule",hall_ticket:"Hall Ticket",answer_key:"Answer Key",result:"Exam Result",cutoff:"Cut-off / Merit List",admit_card:"Admit Card",mock_test:"Official Mock Test",other:"Other"};
const categories={result:"result",answer_key:"answer_key",admit_card:"admit_card",exam_date:"exam_update",exam_update:"exam_update",job:"job",notification:"job"};
function date(v){if(!v)return "";const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString("en-IN");}
function link(url,label){return url?'<a class="btn secondary" target="_blank" rel="noopener" href="'+esc(url)+'">'+label+' ↗</a>':"";}
function renderResources(items){if(!items.length)return '<div class="empty">No verified additional files or links have been added for this job yet. Official notices will appear here when available.</div>';return items.map(x=>'<article class="resource"><h3>'+esc(x.title)+'</h3><div class="muted">'+esc(types[x.resource_type]||x.resource_type)+(x.resource_year?' · '+x.resource_year:'')+(x.exam_stage?' · '+esc(x.exam_stage):'')+(x.is_official?' · Official':'')+'</div>'+(x.description?'<p>'+esc(x.description)+'</p>':'')+link(x.resource_url,"Open")+'</article>').join("");}
function renderNotices(items){if(!items.length)return '<div class="empty">There are currently no published Hall Ticket, Exam Date, Answer Key or Result notices for this job.</div>';return items.map(n=>{const cat=categories[n.category]||"job";return '<article class="resource"><h3>'+esc(n.title)+'</h3><div class="muted"><span class="pill">'+esc(cat==="result"?"Exam Result":cat==="answer_key"?"Answer Key":cat==="admit_card"?"Hall Ticket":cat==="exam_update"?"Exam Update":"Notice")+'</span> '+date(n.notice_date)+'</div>'+(n.eligibility_summary?'<p>'+esc(n.eligibility_summary)+'</p>':'')+link(n.official_url,"Official Information")+' <a class="btn secondary" href="government-notice-details.html?id='+encodeURIComponent(n.id)+'">Full Details</a></article>'}).join("");}
function showTest(set){currentSet=set;answers={};$("test").innerHTML='<div class="notice">'+esc(set.disclaimer||"This is a practice paper selected from the question bank, not an official examination paper.")+'</div><h2>'+esc(set.title)+'</h2><p class="muted">'+set.question_count+' questions · One correct answer for each question</p>'+set.questions.map((q,i)=>'<div class="question" id="q'+i+'"><b>'+(i+1)+'. '+esc(q.question)+'</b>'+(q.options||[]).map((o,k)=>'<label class="option"><input type="radio" name="q'+i+'" value="'+k+'" onchange="answers['+i+']='+k+'"> '+String.fromCharCode(65+k)+'. '+esc(o)+'</label>').join('')+'<div class="muted">'+esc(q.topic||"")+'</div></div>').join('')+'<button class="btn" id="submitTest">Submit Answers and View Score</button><div id="scoreBox"></div>';
$("submitTest").onclick=finishTest;}
async function finishTest(){let score=0;currentSet.questions.forEach((q,i)=>{if(Number(answers[i])===Number(q.correct_index))score++;const node=$("q"+i);node.querySelectorAll(".option").forEach((o,k)=>{if(k===Number(q.correct_index))o.classList.add("correct");else if(k===Number(answers[i]))o.classList.add("wrong");});const exp=document.createElement("p");exp.className="muted";exp.textContent="Explanation: "+(q.explanation||"");node.appendChild(exp);});$("scoreBox").innerHTML='<p class="result">Your Score: '+score+' / '+currentSet.questions.length+'</p><p class="muted">This is a practice test score only, not an official examination score.</p>';$("submitTest").disabled=true;}
function detectTopics(job){const s=[job.job_title,job.recruitment_authority,job.employer_name,job.description].filter(Boolean).join(" ").toLowerCase();const topics=["math","reason","general","science","computer"];if(/railway|railway|rrb|ரயில்/.test(s))topics.push("railway");if(/police|police|constable|si\b/.test(s))topics.push("police");if(/teacher|teaching|teacher|school|education/.test(s))topics.push("teaching");if(/medical|nurse|doctor|health|medical|nurse/.test(s))topics.push("medical");return topics;}
function generate(){const count=Math.min(Number($("count").value)||15,QUESTION_BANK.length);const topics=detectTopics(window.currentJob||{});let pool=QUESTION_BANK.filter(q=>topics.includes(q.topic));if(pool.length<count){const extra=QUESTION_BANK.filter(q=>!pool.includes(q));pool=pool.concat(extra);}pool=pool.sort(()=>Math.random()-.5).slice(0,count);const set={id:null,title:(window.currentJob?.job_title||"Government Job")+" — Mock Test",question_count:pool.length,questions:pool,disclaimer:"A practice paper generated from a pre-reviewed question bank. This is not an official examination paper."};showTest(set);}
async function init(){if(!jobId){$("root").textContent="Job ID is missing.";return;}const {data:job,error}=await db.from("jobs").select("*").eq("id",jobId).eq("status","published").maybeSingle();if(error||!job){$("root").textContent="Job details could not be found.";return;}if(job.job_kind!=="government"){$("root").textContent="This exam preparation feature is currently available for government jobs only.";return;}
window.currentJob=job;const title=job.job_title||"Government Job";const {data:resources}=await db.from("job_exam_resources").select("*").eq("job_id",jobId).eq("status","published").order("resource_year",{ascending:false});
const {data:allNotices}=await db.from("government_notices").select("*").eq("is_active",true).order("notice_date",{ascending:false}).limit(500);
const keywords=[job.job_title,job.recruitment_authority,job.notification_number,job.description].filter(Boolean).join(" ").toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>2);
const notices=(allNotices||[]).filter(n=>{const d=n.details||{},hay=[n.title,n.notice_reference,n.eligibility_summary,d.department,d.recruitment_authority,d.post_names,d.exam_name,d.job_title].filter(Boolean).join(" ").toLowerCase();return keywords.some(k=>hay.includes(k));}).slice(0,40);
$("root").className="";$("root").innerHTML='<section class="hero"><div class="muted" style="color:#b9dcff">TAMILAN CAREERS · EXAM PREPARATION CENTRE</div><h1>'+esc(title)+'</h1><p>'+esc(job.recruitment_authority||job.employer_name||"Government Department")+' · '+esc(job.notification_number||"Notice number not specified")+'</p><p>Exam process, syllabus, mock tests and official exam updates for this job.</p></section><section class="panel"><h2>1. Exam Process & Syllabus</h2><p>'+esc(job.selection_process||"Follow the examination stages stated in the official notification. The exact selection process is defined in the notice PDF.")+'</p>'+renderResources((resources||[]).filter(x=>x.resource_type==="syllabus"||x.resource_type==="official_notice"))+link(job.official_notification_url,"Official Job Notice")+'</section><section class="panel"><h2>2. Automatic Mock Test</h2><div class="notice">No external API or paid service is required. Questions are selected from a local question bank based on the job category. This is a practice paper only, not an official examination paper.</div><div class="toolbar" style="margin:12px 0"><label>Questions <select id="count"><option value="10">10</option><option value="15" selected>15</option><option value="25">25</option></select></label><button class="btn" id="generate">Start Mock Test</button></div><div id="test"><div class="empty">Login You can start the mock test without logging in. Questions will be selected automatically.</div></div></section><section class="panel"><h2>3. Previous Question Paper and Official Mock Tests</h2>'+renderResources((resources||[]).filter(x=>["previous_paper","mock_test"].includes(x.resource_type)))+'</section><section class="panel"><h2>4. Hall Ticket · Exam Date · Answer Key · Result</h2>'+renderNotices(notices)+'</section><section class="panel"><h2>5. Document Verification · Medical · Cut-off</h2>'+renderResources((resources||[]).filter(x=>["cutoff","result","other","exam_schedule","hall_ticket","answer_key","admit_card"].includes(x.resource_type)))+'</section>';
$("generate").onclick=generate;
}
init();
