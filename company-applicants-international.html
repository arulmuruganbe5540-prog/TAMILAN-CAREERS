<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>International Job Applicants | TAMILAN CAREERS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243b;font:15px/1.6 Arial,sans-serif}header{background:#101d3a;color:white;padding:18px max(16px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}header h1{font-size:20px;margin:0}header a{color:#fff}main{max-width:1100px;margin:22px auto;padding:0 14px 40px}.panel{background:white;border:1px solid #dce4ef;border-radius:10px;padding:18px;margin:14px 0}.notice{padding:12px;background:#eef6ff;border-radius:7px;margin:10px 0}.muted,.meta{color:#64748b;font-size:13px}.item{border:1px solid #dce4ef;border-radius:8px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:4px}select,textarea{width:100%;padding:9px;border:1px solid #bdc9d8;border-radius:6px;background:white;font:inherit}textarea{min-height:70px}button,.btn{background:#176b9e;color:white;border:0;border-radius:6px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#eaf0f8;color:#17466c}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hidden{display:none!important}.status{display:inline-block;padding:3px 9px;background:#edf3f9;border-radius:20px;font-size:12px;font-weight:bold}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:13px}}
/* Premium employer workspace theme */
:root{--premium-navy:#07152d;--premium-blue:#102b50;--premium-gold:#d6ad62;--premium-gold-light:#f1d99e;--premium-ink:#17243b;--premium-muted:#617087;--premium-border:rgba(190,151,82,.32)}
html{background:#07152d}body{background:radial-gradient(ellipse at 12% 8%,rgba(33,83,132,.72),transparent 42%),radial-gradient(ellipse at 88% 18%,rgba(166,124,56,.22),transparent 36%),linear-gradient(135deg,#061329 0%,#10294a 52%,#07152d 100%)!important;background-attachment:fixed!important;color:var(--premium-ink)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(120deg,transparent 0 48%,rgba(255,255,255,.08) 49%,transparent 50%),radial-gradient(circle at 1px 1px,rgba(241,217,158,.34) 1px,transparent 1.5px);background-size:100% 100%,28px 28px;z-index:0}
.top,header{position:relative;z-index:1;background:linear-gradient(110deg,rgba(5,17,38,.96),rgba(16,43,80,.94))!important;border-bottom:1px solid rgba(214,173,98,.48);box-shadow:0 12px 34px rgba(0,0,0,.22)}

</style></head><body><header><div><h1>TAMILAN CAREERS — International Job Applicants</h1><small>Private employer applicant management</small></div><nav><a href="company-job-portal.html">Employer Portal</a> · <a href="index.html">Website</a></nav></header><main><div id="guard" class="panel"><h2>Employer sign in required</h2><a class="btn" href="employer-auth.html?redirect=company-applicants-international.html">Sign in</a></div><div id="app" class="hidden"><section class="panel"><h2 id="companyName">Loading company…</h2><p class="muted">International employer applications are shown here only.</p><div id="message" class="notice hidden" role="status"></div><div id="summary" class="notice">Loading applications…</div></section><section class="panel"><h2>Applications</h2><div id="list">Loading…</div></section></div></main><script>(()=>{const db=supabase.createClient('https://qkmljuuusfjowexvybvy.supabase.co','sb_publishable_Wi6gltM_xFm1m4Dlgq727Q_83Rn58y2'),$=id=>document.getElementById(id),companyId=new URLSearchParams(location.search).get('company_id');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const say=(t,bad=false)=>{$('message').textContent=t;$('message').classList.remove('hidden');$('message').style.background=bad?'#fff0f0':'#eef6ff';$('message').style.color=bad?'#8d2525':'#234967'};async function init(){const {data:{session}}=await db.auth.getSession();if(!session)return;const uid=session.user.id;const mem=await db.from('company_members').select('company_id,member_role,member_status').eq('user_id',uid).eq('member_status','active').in('member_role',['owner','hr_manager','recruiter']);if(mem.error)throw mem.error;const ids=(mem.data||[]).map(x=>x.company_id);if(!ids.length){$('guard').classList.remove('hidden');say('No active employer company membership was found.',true);return}const cid=companyId||ids[0];if(!ids.includes(cid)){say('You do not have access to this company.',true);return}const co=await db.from('companies').select('id,company_name,international_jobs_verification_status').eq('id',cid).maybeSingle();if(co.error||!co.data||co.data.international_jobs_verification_status!=='verified'){say('This company is not verified for this job market.',true);return}$('guard').classList.add('hidden');$('app').classList.remove('hidden');$('companyName').textContent=co.data.company_name;const jobs=await db.from('international_jobs').select('id,job_title,location,country_name').eq('company_id',cid);if(jobs.error)throw jobs.error;const jobIds=(jobs.data||[]).map(x=>x.id);if(!jobIds.length){$('summary').textContent='No jobs have been posted by this company yet.';$('list').textContent='No applications yet.';return}const apps=await db.from('international_job_applications').select('id,job_id,candidate_id,resume_id,cover_letter,status,applied_at,application_details').in('job_id',jobIds).order('applied_at',{ascending:false}).limit(500);if(apps.error)throw apps.error;const rows=apps.data||[];$('summary').textContent=rows.length+' application(s) received across '+jobIds.length+' job(s).';if(!rows.length){$('list').textContent='No applications received yet.';return}const candidateIds=[...new Set(rows.map(x=>x.candidate_id))],resumeIds=[...new Set(rows.map(x=>x.resume_id).filter(Boolean))];const [profiles,details,resumes]=await Promise.all([db.from('profiles').select('id,full_name,email,phone').in('id',candidateIds),db.from('job_seeker_profiles').select('user_id,highest_qualification,qualification_subject,institution_name,graduation_year,total_experience_months,current_city,nationality,skills,languages').in('user_id',candidateIds),resumeIds.length?db.from('candidate_resumes').select('id,user_id,resume_title,file_path,original_file_name').in('id',resumeIds):Promise.resolve({data:[],error:null})]);if(profiles.error)throw profiles.error;if(details.error)throw details.error;if(resumes.error)throw resumes.error;const pm=Object.fromEntries((profiles.data||[]).map(x=>[x.id,x])),dm=Object.fromEntries((details.data||[]).map(x=>[x.user_id,x])),rm=Object.fromEntries((resumes.data||[]).map(x=>[x.id,x])),jm=Object.fromEntries((jobs.data||[]).map(x=>[x.id,x]));$('list').innerHTML='';for(const a of rows){const p=pm[a.candidate_id]||{},d=dm[a.candidate_id]||{},j=jm[a.job_id]||{},r=rm[a.resume_id]||{},v=a.application_details||{};const card=document.createElement('article');card.className='item';let resumeHtml='';if(r.file_path){const signed=await db.storage.from('candidate-resumes').createSignedUrl(r.file_path,300);if(!signed.error)resumeHtml='<a class="btn secondary" target="_blank" rel="noopener" href="'+esc(signed.data.signedUrl)+'">View Resume / CV</a>'}const extra=true?'<p><b>Nationality:</b> '+esc(v.application_nationality||d.nationality)+' · <b>Residence:</b> '+esc(v.residence_country||'')+'</p><p><b>Passport available:</b> '+esc(v.passport_available===true?'Yes':v.passport_available===false?'No':'Not stated')+' · <b>Passport expiry:</b> '+esc(v.passport_expiry||'Not stated')+'</p><p><b>Work visa:</b> '+esc(v.valid_work_visa||'Not stated')+' · <b>Sponsorship needed:</b> '+esc(v.visa_sponsorship_needed||'Not stated')+' · <b>Relocation:</b> '+esc(v.relocation_willingness||'Not stated')+'</p><p><b>English level:</b> '+esc(v.english_level||'Not stated')+'</p>':'<p><b>Current city:</b> '+esc(d.current_city||v.current_city||'')+' · <b>Expected salary:</b> '+esc(v.expected_salary_inr||'Not specified')+' · <b>Relocation:</b> '+esc(v.relocation_willingness||'Not stated')+'</p>';card.innerHTML='<h3>'+esc(p.full_name||'Job Seeker')+' <span class="status">'+esc(a.status)+'</span></h3><p class="meta">'+esc(p.email||'')+' · '+esc(p.phone||'')+' · Applied '+new Date(a.applied_at).toLocaleString()+'</p><p><b>Job:</b> '+esc(j.job_title||'')+' · '+esc(j.location||j.country_name||'')+'</p><p><b>Education:</b> '+esc(d.highest_qualification||v.qualification||'')+' '+esc(d.qualification_subject||'')+' · '+esc(d.institution_name||'')+' · '+esc(d.graduation_year||'')+'</p><p><b>Experience:</b> '+esc(d.total_experience_months??v.experience_months??0)+' months</p><p><b>Skills:</b> '+esc((d.skills||v.skills||[]).join(', '))+' · <b>Languages:</b> '+esc((d.languages||v.languages||[]).join(', '))+'</p>'+extra+'<p><b>Cover Letter:</b><br>'+esc(a.cover_letter||'Not provided').replace(/\n/g,'<br>')+'</p><div class="actions">'+resumeHtml+'</div><div class="grid"><div class="field"><label>Update application status</label><select class="statusChoice"><option value="under_review">Under Review</option><option value="shortlisted">Shortlisted</option><option value="interview">Interview</option><option value="selected">Selected</option><option value="offer_sent">Offer Sent</option><option value="rejected">Rejected</option></select></div><div class="field"><label>Message to applicant (optional)</label><textarea class="note" maxlength="1000" placeholder="Add a short status update note"></textarea></div></div><div class="actions"><button class="saveStatus">Save Status & Notify Applicant</button></div>';const select=card.querySelector('.statusChoice');select.value=['under_review','shortlisted','interview','selected','offer_sent','rejected'].includes(a.status)?a.status:'under_review';card.querySelector('.saveStatus').onclick=async()=>{const btn=card.querySelector('.saveStatus');btn.disabled=true;const {error}=await db.rpc('tc_company_update_international_application_status',{p_application_id:a.id,p_status:select.value,p_note:card.querySelector('.note').value.trim()||null});if(error)say(error.message,true);else{say('Application status updated and the applicant was notified.');a.status=select.value;select.blur();}btn.disabled=false};$('list').append(card)}}init().catch(e=>say(e.message,true))})();</script></body></html>
