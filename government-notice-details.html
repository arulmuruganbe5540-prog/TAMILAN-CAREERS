<footer><b>TAMILAN CAREERS</b><br>அரசு வேலைவாய்ப்பு தகவல்களைப் பயன்படுத்தும் முன் அசல் அதிகாரப்பூர்வ அறிவிப்பைச் சரிபார்க்கவும்.<br>இந்தத் தளம் அரசு இணையதளம் அல்ல.</footer>
<script>
(function(){
 const root=document.getElementById("content"),id=new URLSearchParams(location.search).get("id");
 const client=window.supabase.createClient("https://qkmljuuusfjowexvy.supabase.co","sb_publishable_Wi6gltM_xFm1m4Dlgq727Q_83Rn58y2");
 const labels={post_names:"பதவிகள்",qualification:"கல்வித் தகுதி",education:"கல்வித் தகுதி",age_limit:"வயது வரம்பு",salary:"சம்பளம்",pay_scale:"ஊதிய நிலை",application_fee:"விண்ணப்பக் கட்டணம்",selection_process:"தேர்வு முறை",location:"பணியிடம்",department:"துறை",vacancies_breakdown:"காலியிட விவரம்",experience:"அனுபவம்",job_type:"வேலை வகை",important_dates:"முக்கிய தேதிகள்",how_to_apply:"விண்ணப்பிக்கும் முறை",documents_required:"தேவையான ஆவணங்கள்",official_website:"அதிகாரப்பூர்வ இணையதளம்",notification_pdf_url:"அறிவிப்பு PDF",application_url:"விண்ணப்ப இணைப்பு",apply_url:"விண்ணப்ப இணைப்பு",state:"மாநிலம்",authority:"அறிவிப்பு வெளியிட்ட நிறுவனம்",scope:"வகை",last_date:"கடைசி தேதி",application_start:"விண்ணப்பத் தொடக்கம்"};
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const nice=k=>labels[k]||k.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
 const date=v=>{if(!v)return "அறிவிப்பில் குறிப்பிடப்படவில்லை";const d=new Date(String(v).length===10?v+"T00:00:00":v);return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString("ta-IN",{day:"numeric",month:"long",year:"numeric"})};
 const val=v=>Array.isArray(v)?v.map(x=>typeof x==="object"&&x!==null?Object.entries(x).map(([k,y])=>nice(k)+": "+String(y??"—")).join(" · "):String(x)).join(" • "):(typeof v==="object"&&v!==null?Object.entries(v).map(([k,x])=>nice(k)+": "+String(x??"—")).join(" | "):String(v));
 const block=(k,v)=>'<div class="fact"><small>'+esc(nice(k))+'</small><b>'+esc(val(v))+'</b></div>';
 function section(title,items){if(!items.length)return "";return '<section class="panel"><div class="section-kicker">JOB INFORMATION</div><h2>'+esc(title)+'</h2><dl class="detail-list">'+items.map(([k,v])=>'<dt>'+esc(nice(k))+'</dt><dd>'+esc(val(v))+'</dd>').join("")+'</dl></section>'}
 async function load(){
  if(!id){root.textContent="அறிவிப்பு ID கிடைக்கவில்லை. முந்தைய பக்கத்திற்குச் சென்று அறிவிப்பைத் தேர்ந்தெடுக்கவும்.";return}
  const {data,error}=await client.from("government_notices").select("id,title,category,official_url,notice_reference,notice_date,application_start,application_end,vacancies,eligibility_summary,details,is_active").eq("id",id).eq("is_active",true).maybeSingle();
  if(error||!data){root.textContent="இந்த அறிவிப்பு தற்போது கிடைக்கவில்லை. மீண்டும் அறிவிப்புப் பட்டியலைப் பார்க்கவும்.";return}
  const d=data.details&&typeof data.details==="object"?data.details:{};
  const official=safe(d.notification_pdf_url)||safe(data.official_url),apply=safe(d.application_url)||safe(d.apply_url),website=safe(d.official_website);
  const expired=data.application_end&&new Date(data.application_end+"T23:59:59")<new Date();
  const top=[["அறிவிப்பு தேதி",date(data.notice_date)],["காலியிடங்கள்",data.vacancies==null?"அதிகாரப்பூர்வ PDF-ல் பார்க்கவும்":Number(data.vacancies).toLocaleString("en-IN")],["விண்ணப்பத் தொடக்கம்",date(data.application_start)],["கடைசி தேதி",date(data.application_end)]];
  const exclude=new Set(["scope","state","authority","notification_pdf_url","application_url","apply_url","official_website"]);
  const entries=Object.entries(d).filter(([k,v])=>!exclude.has(k)&&v!==null&&v!==""&&typeof v!=="boolean");
  const groups=[["பதவிகள் மற்றும் காலியிடங்கள்",entries.filter(([k])=>/post|vacanc|designation|role/i.test(k))],["கல்வி மற்றும் வயதுத் தகுதி",entries.filter(([k])=>/qualif|education|age|experience/i.test(k))],["சம்பளம் மற்றும் கட்டணம்",entries.filter(([k])=>/salary|pay|fee|stipend/i.test(k))],["தேர்வு மற்றும் விண்ணப்ப முறை",entries.filter(([k])=>/selection|exam|apply|document|procedure|process/i.test(k))],["மற்ற முக்கிய விவரங்கள்",entries.filter(([k])=>!/post|vacanc|designation|role|qualif|education|age|experience|salary|pay|fee|stipend|selection|exam|apply|document|procedure|process/i.test(k))]].filter(([,a])=>a.length);
  const links=(official?'<a class="btn btn-light" href="'+esc(official)+'" target="_blank" rel="noopener">அசல் அறிவிப்பு PDF ↗</a>':"")+(apply?'<a class="btn btn-primary" href="'+esc(apply)+'" target="_blank" rel="noopener">Apply Online ↗</a>':"")+(website?'<a class="btn btn-green" href="'+esc(website)+'" target="_blank" rel="noopener">அதிகாரப்பூர்வ இணையதளம் ↗</a>':"");
  root.className="";
  root.innerHTML='<section class="hero"><div class="eyebrow">TAMILAN CAREERS · OFFICIAL NOTICE DETAILS</div><h1>'+esc(data.title)+'</h1><p>'+esc(d.authority||"அதிகாரப்பூர்வ அறிவிப்பு")+(d.state?" · "+esc(d.state):"")+'</p><div class="chips"><span class="chip">'+esc(data.category||"அரசு அறிவிப்பு")+'</span><span class="chip '+(expired?"":"status")+'">'+(expired?"விண்ணப்பக் காலம் முடிந்தது":data.application_end?"விண்ணப்ப காலம்":"அறிவிப்பு")+'</span>'+(data.notice_reference?'<span class="chip">அறிவிப்பு எண்: '+esc(data.notice_reference)+'</span>':"")+'</div><div class="hero-actions">'+links+'</div></section><div class="stats">'+top.map(([k,v])=>'<div class="stat"><small>'+esc(k)+'</small><b>'+esc(v)+'</b></div>').join("")+'</div><div class="layout"><div><section class="panel"><div class="section-kicker">OVERVIEW</div><h2>வேலைவாய்ப்பு சுருக்கம்</h2><div class="facts">'+block("அறிவிப்பு வெளியிட்ட நிறுவனம்",d.authority||"அதிகாரப்பூர்வ அறிவிப்பு")+block("மாநிலம் / பகுதி",d.state|| (d.scope==="central"?"மத்திய அரசு":"அறிவிப்பின்படி"))+block("துறை",d.department||"அறிவிப்பில் பார்க்கவும்")+block("காலியிடங்கள்",data.vacancies==null?"அறிவிப்பில் பார்க்கவும்":data.vacancies)+'</div>'+(data.eligibility_summary?'<p style="margin-top:13px">'+esc(data.eligibility_summary)+'</p>':"")+'</section>'+groups.map(([t,a])=>section(t,a)).join("")+'<section class="panel"><div class="section-kicker">IMPORTANT DATES</div><h2>முக்கிய தேதிகள்</h2><div class="facts">'+top.map(([k,v])=>block(k,v)).join("")+'</div></section><section class="panel"><div class="section-kicker">HOW TO APPLY</div><h2>விண்ணப்பிக்கும் முன் கவனிக்கவும்</h2><p>வயது கணக்கிடும் தேதி, கல்வித் தகுதி, இடஒதுக்கீடு, கட்டணம் மற்றும் விண்ணப்பிக்கும் வழிமுறைகளை அசல் அதிகாரப்பூர்வ PDF-ல் சரிபார்க்கவும். தெளிவில்லாத விவரங்கள் ஊகித்து நிரப்பப்படவில்லை.</p></section></div><aside class="side"><section class="panel"><h2>முக்கிய இணைப்புகள்</h2>'+links+'<div class="notice">விண்ணப்பிக்கும் முன் அதிகாரப்பூர்வ அறிவிப்பை முழுமையாகப் படிக்கவும். தனிப்பட்ட தகவல் அல்லது பணத்தை அதிகாரப்பூர்வமற்ற நபர்களிடம் வழங்க வேண்டாம்.</div><p class="source">தகவல் மூலம்: '+esc(d.authority||"அதிகாரப்பூர்வ அறிவிப்பு")+' · பதிவு: '+esc(date(data.notice_date))+'</p></section></aside></div>';
 }
 function safe(v){try{const u=new URL(v);return u.protocol==="https:"?u.href:""}catch{return ""}}
 load();
})();
</script>
