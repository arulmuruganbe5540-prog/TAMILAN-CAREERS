  const top=[["அறிவிப்பு வெளியான நாள்",date(data.notice_date)],["மொத்த காலியிடங்கள்",data.vacancies==null?"அதிகாரப்பூர்வ PDF-ல் பார்க்கவும்":Number(data.vacancies).toLocaleString("en-IN")],["விண்ணப்பத் தொடக்க நாள்",date(data.application_start)],["விண்ணப்பக் கடைசி நாள்",date(data.application_end)]];
