:root{--navy:#10233f;--blue:#1677d2;--ink:#17263d;--muted:#65758b;--line:#e2e9f2;--soft:#f3f7fc;--green:#16804b}
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:var(--ink);font-family:Arial,"Noto Sans Tamil",sans-serif;line-height:1.75}
header{background:var(--navy);color:#fff;padding:13px max(18px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900;font-size:21px;color:#58caff;text-decoration:none}.brand span{color:#fff}nav{display:flex;gap:8px;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;background:#ffffff17;padding:7px 10px;border-radius:8px;font-size:12px}
main{max-width:1120px;margin:22px auto;padding:0 16px}.crumb{font-size:12px;color:var(--muted);margin-bottom:13px}.crumb a{color:var(--blue);text-decoration:none}
.hero{background:linear-gradient(120deg,#10233f,#174d83);color:#fff;border-radius:18px;padding:27px;position:relative;overflow:hidden;box-shadow:0 12px 32px #10233f20}.hero:after{content:"";position:absolute;width:230px;height:230px;border:35px solid #ffffff0d;border-radius:50%;right:-75px;top:-95px;pointer-events:none}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;color:#9edbff}.hero h1{font-size:clamp(23px,4vw,36px);line-height:1.4;margin:9px 0}.hero p{margin:5px 0;color:#d6e7f8}.chips,.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.chip{font-size:11px;padding:5px 9px;border-radius:20px;background:#ffffff18;color:#fff}.status{background:#dff7e9;color:#17613b}.hero-actions{position:relative;z-index:1;margin-top:19px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 15px;border-radius:9px;text-decoration:none;font-weight:800;font-size:13px;border:0;cursor:pointer}.btn-primary{background:#1688ed;color:white}.btn-light{background:#fff;color:#174777}.btn-green{background:#dff7e9;color:#17613b}.btn-outline{background:#eef5fc;color:#174777}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:15px 0}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.stat{padding:14px;min-width:0}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{display:block;margin-top:3px;font-size:14px;overflow-wrap:anywhere}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:15px;align-items:start}.panel{padding:19px;margin-bottom:14px;box-shadow:0 5px 18px #10233f08}.panel h2{font-size:18px;margin:0 0 12px;color:#174777}.panel p{margin:0;color:#43536a}.section-kicker{font-size:10px;color:var(--blue);font-weight:900;letter-spacing:.08em;margin-bottom:4px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.fact{background:var(--soft);padding:11px;border-radius:9px;min-width:0}.fact small{display:block;color:var(--muted);font-size:11px}.fact b{font-size:13px;overflow-wrap:anywhere}.detail-list{display:grid;grid-template-columns:minmax(140px,.7fr) minmax(0,1.3fr);gap:8px 13px;font-size:13px}.detail-list dt{font-weight:800;color:#5a6b82}.detail-list dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}.side{position:sticky;top:12px}.side .panel{padding:16px}.side a{display:flex;margin-top:9px}.notice{background:#fff8e8;border:1px solid #f1dfb8;color:#76591e;border-radius:10px;padding:12px;font-size:12px;margin-top:12px}.source{font-size:11px;color:var(--muted);margin-top:13px}.empty{background:white;padding:25px;border:1px solid var(--line);border-radius:14px;text-align:center;color:var(--muted)}.intro{font-size:14px;color:#43536a;line-height:1.9}.missing{color:#7b8797;font-weight:500}.apply-steps{margin:0;padding-left:20px;color:#43536a;font-size:13px}.apply-steps li{margin:6px 0}.trust{display:flex;gap:9px;align-items:flex-start;background:#eef8f2;border:1px solid #d4ebdc;border-radius:11px;padding:12px;color:#245a3c;font-size:12px;margin-top:12px}
footer{margin-top:30px;background:#09152c;color:#d3deef;padding:25px 15px;text-align:center;font-size:12px}
@media(max-width:780px){.layout{grid-template-columns:1fr}.side{position:static}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:20px}}
@media(max-width:480px){main{padding:0 11px}.panel{padding:15px}.facts{grid-template-columns:1fr}.detail-list{grid-template-columns:1fr;gap:2px}.detail-list dd{margin-bottom:8px}.hero-actions .btn{flex:1}}

<body>
<header><a class="brand" href="index.html"><span class="tc-domain-brand">WWW.TAMILANCAREERS.IN</span></a><nav><a href="index.html">Home</a><a href="indian-government-jobs.html">Central Government</a><a href="tamil-nadu-government-jobs.html">Tamil Nadu Government</a><a href="community.html">Notices</a></nav></header>
<main>
<div class="crumb"><a href="index.html">Home</a> / <a href="indian-government-jobs.html">Government Jobs</a> / Full Details</div>
<div id="content" class="empty">Loading official notification details…</div>
</main>
<footer><b>TAMILAN CAREERS</b><br>Check the original official notification before relying on government job information.<br>This is not a government website.</footer>
<script>
(()=> {
 const root=document.getElementById("content"),id=new URLSearchParams(location.search).get("id");
 const client=window.supabase.createClient("https://qkmljuuusfjowexvybvy.supabase.co","sb_publishable_Wi6gltM_xFm1m4Dlgq727Q_83Rn58y2");
 const labels={post_names:"Positions",posts:"Positions",designation:"Job Title",qualification:"Educational Qualification",educational_qualification:"Educational Qualification",education:"Educational Qualification",age_limit:"Age Limit",age_relaxation:"Age Relaxation",salary:"Salary",pay_scale:"Pay Scale",application_fee:"Application Fee",selection_process:"Selection Process",exam_pattern:"Selection Process",location:"Work Location",job_location:"Work Location",department:"Department",vacancies_breakdown:"Vacancy Details",experience:"Experience",job_type:"Employment Type",important_dates:"Important Dates",how_to_apply:"How to Apply",documents_required:"Required Documents",official_website:"Official Website",notification_pdf_url:"Notification PDF",application_url:"Application Link",apply_url:"Application Link",state:"State",authority:"Issuing Authority",scope:"Notice Type",last_date:"Deadline",application_start:"Application Start Date",application_end:"Application Deadline",description:"Notice Description",job_description:"Job Details",application_mode:"How to Apply",reservation:"Reservation",fee_exemption:"Fee Exemption",syllabus:"Syllabus",important_instructions:"Important Instructions"};
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const nice=k=>labels[String(k).toLowerCase()]||String(k).replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
 const date=v=>{if(!v)return "See the official notification";const d=new Date(String(v).length===10?v+"T00:00:00":v);return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString("ta-IN",{day:"numeric",month:"long",year:"numeric"})};
 const safe=v=>{try{const u=new URL(v);return u.protocol==="https:"?u.href:""}catch{return ""}};
 const val=v=>Array.isArray(v)?v.map(x=>typeof x==="object"&&x!==null?Object.entries(x).map(([k,y])=>nice(k)+": "+String(y??"—")).join(" · "):String(x)).join(" • "):(typeof v==="object"&&v!==null?Object.entries(v).map(([k,x])=>nice(k)+": "+String(x??"—")).join(" | "):String(v));
 const block=(k,v)=>'<div class="fact"><small>'+esc(k)+'</small><b>'+esc(val(v))+'</b></div>';
 const section=(title,items)=>!items.length?"":'<section class="panel"><div class="section-kicker">Job Details</div><h2>'+esc(title)+'</h2><dl class="detail-list">'+items.map(([k,v])=>'<dt>'+esc(nice(k))+'</dt><dd>'+esc(val(v))+'</dd>').join("")+'</dl></section>';
 const link=(url,text,cls)=>url?'<a class="btn '+cls+'" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(text)+' ↗</a>':"";
 async function load(){
  if(!id){root.textContent="Notice ID is missing. Return to the previous page and select a notice.";return}
  const {data,error}=await client.from("government_notices").select("id,title,category,official_url,notice_reference,notice_date,application_start,application_end,vacancies,eligibility_summary,details,is_active").eq("id",id).eq("is_active",true).maybeSingle();
  if(error||!data){root.textContent="This notice is not currently available in the published list. Return to the government jobs list.";return}
  const d=data.details&&typeof data.details==="object"?data.details:{};
  const pdf=safe(d.notification_pdf_url)||safe(d.pdf_url);
  const apply=safe(d.application_url)||safe(d.apply_url);
  const website=safe(d.official_website)||safe(d.website_url);
  const source=safe(data.official_url)||safe(d.source_url)||website;
  const expired=data.application_end&&new Date(data.application_end+"T23:59:59")<new Date();
  const categoryNames={recruitment:"Recruitment Notice",result:"Exam Result",admit_card:"Admit Card / Hall Ticket",answer_key:"Answer Key",exam_update:"Exam Update",other:"Government Notice"};
  const top=[["Notice Publication Date",date(data.notice_date)],["Total Vacancies",data.vacancies==null?"See the official PDF":Number(data.vacancies).toLocaleString("en-IN")],["Application Start Date",date(data.application_start)],["Application Deadline",date(data.application_end)]];
  const hidden=new Set(["scope","state","authority","notification_pdf_url","pdf_url","application_url","apply_url","official_website","website_url","source_url","ai_extraction","missing_fields","confidence"]);
  const entries=Object.entries(d).filter(([k,v])=>!hidden.has(k)&&v!==null&&v!==""&&typeof v!=="boolean"&&!String(k).toLowerCase().includes("url"));
  const groups=[
   ["Positions and Vacancies",entries.filter(([k])=>/post|vacanc|designation|role/i.test(k))],
   ["Educational Qualification and Age Limit",entries.filter(([k])=>/qualif|education|age|experience/i.test(k))],
   ["Salary and Application Fee",entries.filter(([k])=>/salary|pay|fee|stipend/i.test(k))],
   ["Selection Process and Application Instructions",entries.filter(([k])=>/selection|exam|apply|document|procedure|process|syllabus/i.test(k))],
   ["Other Important Details",entries.filter(([k])=>!/post|vacanc|designation|role|qualif|education|age|experience|salary|pay|fee|stipend|selection|exam|apply|document|procedure|process|syllabus/i.test(k))]
  ].filter(([,a])=>a.length);
  const actions=link(pdf,"Official Notification PDF","btn-light")+link(apply,"Apply on the Official Website","btn-primary")+link(website,"Official Website","btn-green")+link(!pdf&&!website?source:"","View Original Notification","btn-outline");
  const summary=data.eligibility_summary?'<section class="panel"><div class="section-kicker">Eligibility Summary</div><h2>Who Can Apply for This Job?</h2><p class="intro">'+esc(data.eligibility_summary)+'</p></section>':"";
  root.className="";
  root.innerHTML='<section class="hero"><div class="eyebrow">TAMILAN CAREERS · Government Job Application Guide</div><h1>'+esc(data.title)+'</h1><p>'+esc(d.authority||"Official Notification")+(d.state?" · "+esc(d.state):"")+'</p><div class="chips"><span class="chip">'+esc(categoryNames[data.category]||"Government Notice")+'</span><span class="chip '+(expired?"":"status")+'">'+(expired?"Application Period Closed":data.application_end?"Application Period":"Notification Details")+'</span>'+(data.notice_reference?'<span class="chip">Notification Number: '+esc(data.notice_reference)+'</span>':"")+'</div><div class="hero-actions">'+actions+'</div></section>'+
  '<div class="stats">'+top.map(([k,v])=>'<div class="stat"><small>'+esc(k)+'</small><b>'+esc(v)+'</b></div>').join("")+'</div>'+
  '<div class="layout"><div><section class="panel"><div class="section-kicker">Notice Overview</div><h2>Job Summary</h2><div class="facts">'+block("Issuing Authority",d.authority||"See Official Notice")+block("State / Section",d.state||(d.scope==="central"?"Central Government":"As stated in the notification"))+block("Department",d.department||"See Official Notice")+block("Vacancies",data.vacancies==null?"See Official Notice":data.vacancies)+'</div></section>'+summary+groups.map(([t,a])=>section(t,a)).join("")+
  '<section class="panel"><div class="section-kicker">Important Dates</div><h2>Application Schedule</h2><div class="facts">'+top.map(([k,v])=>block(k,v)).join("")+'</div></section>'+
  '<section class="panel"><div class="section-kicker">Application Guide</div><h2>How to Apply</h2><ol class="apply-steps"><li>First, open and read the official notification PDF in full.</li><li>Educational Qualification, Age Limit, Reservation and check the fee details.</li><li>Register on the application website and enter the requested information accurately.</li><li>Upload the required certificates and photograph.</li><li>After submitting the application, keep the receipt and application number safe.</li></ol><p class="source">These are general guidelines. The procedure stated in the relevant notification is final.</p></section></div>'+
  '<aside class="side"><section class="panel"><div class="section-kicker">OFFICIAL LINKS</div><h2>Official Links</h2>'+link(pdf,"Original Notification PDF","btn-light")+link(apply,"Apply Now","btn-primary")+link(website,"Official Website","btn-green")+link(!pdf&&!website?source:"","Original Notification Website","btn-outline")+'<div class="trust">✓ <span>Confirm the final details in the original government notification before applying. TAMILAN CAREERS is not a government website.</span></div><p class="source">Information Source: '+esc(d.authority||"Official Notification")+'<br>Notice Date: '+esc(date(data.notice_date))+'</p></section></aside></div>';
 }
 load().catch(()=>{root.textContent="Unable to load details. Please try again later.";});
})();
</script>
