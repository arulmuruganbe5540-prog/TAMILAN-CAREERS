
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | TAMILAN CAREERS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;max-width:100%;overflow-x:clip}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#101d3a,#1765a5);min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 16px 24px}
.tc-globalbar{width:100vw;flex:0 0 auto;align-self:center}
.card{background:white;width:100%;max-width:440px;margin:auto;padding:30px;border-radius:18px;box-shadow:0 15px 45px #0004}
.logo{text-align:center;font-size:25px;font-weight:bold;color:#147bd1;margin-bottom:8px}
.subtitle{text-align:center;color:#778397;font-size:14px;margin-bottom:25px}
h2{text-align:center;color:#172b4d;font-size:23px;margin-bottom:20px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.role{appearance:none;width:100%;padding:13px;border:1px solid #dce4ee;border-radius:9px;text-align:center;cursor:pointer;font:700 14px Arial,sans-serif;background:#fff;color:#40516a}
.role.active{background:#eaf4ff;border:2px solid #1688ed;color:#126cc1}
label{display:block;font-size:14px;font-weight:bold;margin:13px 0 7px;color:#34445b}
input{width:100%;padding:13px;border:1px solid #d7deea;border-radius:8px;font-size:15px;outline:none}
input:focus{border-color:#1688ed}
.form-help{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:9px;font-size:13px;flex-wrap:wrap}
.form-help a,.text-link{color:#126cc1;font-weight:bold;text-decoration:none;cursor:pointer}
.confirm-wrap{display:none;margin-top:14px}
.strength{height:6px;background:#e7edf5;border-radius:9px;overflow:hidden;margin-top:8px}
.strength span{display:block;height:100%;width:0;background:#d94848;transition:width .2s,background .2s}
.strength-label{font-size:12px;color:#66758b;margin-top:5px}
.terms{display:none;align-items:flex-start;gap:9px;margin-top:15px;font-size:13px;line-height:1.5;color:#526176}
.terms input{width:auto;margin-top:3px}
.password-wrap{position:relative}
.password-wrap input{padding-right:82px}
.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#eef5fc;color:#126cc1;border-radius:6px;padding:8px 10px;font-size:13px;font-weight:bold;cursor:pointer}
.password-toggle:focus-visible{outline:2px solid #1688ed;outline-offset:2px}
.mainbtn{width:100%;padding:14px;border:0;border-radius:8px;background:#1688ed;color:white;font-size:16px;font-weight:bold;margin-top:20px;cursor:pointer}
.mainbtn:disabled{opacity:.6}
.switch{text-align:center;margin-top:20px;color:#66758b;font-size:14px}
.switch a{color:#147bd1;font-weight:bold;cursor:pointer}
.message{margin-top:15px;padding:12px;border-radius:8px;font-size:14px;display:none;line-height:1.6}
.resend-btn{display:none;width:100%;padding:11px;border:1px solid #c9d8e9;border-radius:8px;background:#f4f8fd;color:#126cc1;font-weight:bold;margin-top:9px;cursor:pointer}
.back{text-align:center;margin-top:22px}
.back a{color:#147bd1;text-decoration:none;font-size:14px}
.note{font-size:12px;color:#778397;text-align:center;margin-top:18px;line-height:1.6}
@media(max-width:600px){
html,body{width:100%!important;min-width:0!important;overflow-x:hidden!important}
body{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:flex-start!important;gap:12px!important;padding:0 14px 24px!important}
body>.tc-globalbar,#tc-globalbar{position:relative!important;inset:auto!important;display:block!important;order:0!important;width:calc(100% + 28px)!important;max-width:none!important;margin:0 -14px!important;flex:0 0 auto!important}
.tc-globalbar-inner{width:100%!important;max-width:none!important;justify-content:center!important;gap:8px!important;padding:9px 10px!important}
body>.card{display:block!important;order:1!important;width:100%!important;max-width:440px!important;margin:8px auto 0!important;padding:24px 20px!important;flex:0 1 auto!important}
}
</style><style>.logo .tc-domain-brand{color:#167bd1!important;text-shadow:none!important}</style>
  <link rel="stylesheet" href="assets/site-protection.css">
<style>
/* Consistent premium text-only site identity */
.tc-domain-brand{display:inline-block!important;color:#eaf8ff!important;font-size:clamp(13px,2vw,19px)!important;font-weight:900!important;letter-spacing:.8px!important;line-height:1.2!important;white-space:nowrap!important;text-decoration:none!important;text-shadow:0 1px 10px rgba(72,190,255,.16)}
@media(max-width:480px){.tc-domain-brand{font-size:12px!important;letter-spacing:.35px!important}}
</style></head>

<body>
<div class="card">

  <div class="logo"><span class="tc-domain-brand">WWW.TAMILANCAREERS.IN</span></div>
  <p class="subtitle">Start building your future today</p>

  <h2 id="heading">Login to your account</h2>

  <div class="roles">
    <button class="role active" id="seeker" type="button" onclick="chooseRole('job_seeker')" aria-pressed="true">👤 Job Seeker</button>
    <button class="role" id="company" type="button" onclick="chooseRole('company')" aria-pressed="false">🏢 Company</button>
  </div>

  <form id="authForm">

    <div id="nameField" style="display:none">
      <label for="fullName">Full Name</label>
      <input id="fullName" type="text" placeholder="Enter your name">
    </div>

    <label for="email">Email Address</label>
    <input id="email" type="email" placeholder="example@gmail.com" autocomplete="email" required>

    <label for="password">Password</label>
    <div class="password-wrap">
      <input id="password" type="password" placeholder="At least 8 characters" minlength="8" autocomplete="current-password" required>
      <button class="password-toggle" id="passwordToggle" type="button" onclick="togglePassword()" aria-label="Show password" aria-pressed="false">Show</button>
    </div>

    <div class="form-help"><span id="passwordHint">At least 8 characters</span><a href="#" id="forgotLink">Forgot Password?</a></div>
    <div class="confirm-wrap" id="confirmWrap">
      <label for="confirmPassword">Confirm Password</label>
      <div class="password-wrap"><input id="confirmPassword" type="password" placeholder="Enter your password again" autocomplete="new-password"><button class="password-toggle" type="button" onclick="toggleFieldPassword('confirmPassword',this)">Show</button></div>
      <div class="strength"><span id="strengthBar"></span></div><div class="strength-label" id="strengthLabel">Password strength</div>
    </div>
    <label class="terms" id="termsRow"><input id="termsAgree" type="checkbox"><span>I agree to the <a class="text-link" href="terms.html" target="_blank" rel="noopener">Terms of Use</a>, <a class="text-link" href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span></label>

    <button class="mainbtn" id="submitBtn" type="submit">Login</button>

  </form>

  <div class="switch">
    <span id="switchText">Don't have an account?</span>
    <a id="switchLink" onclick="toggleMode()">Register</a>
  </div>

  <div class="message" id="message"></div>
  <button class="resend-btn" id="resendBtn" type="button">Resend email confirmation</button>

  <div class="back">
    <a href="index.html">← Back to Home</a>
  </div>

  <p class="note">TAMILAN CAREERS – One platform for job seekers and employers.</p>

</div>

<script>
const SUPABASE_URL = "https://qkmljuuusfjowexvybvy.supabase.co";

const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Wi6gltM_xFm1m4Dlgq727Q_83Rn58y2";

let selectedRole = "job_seeker";
let isRegister = false;
let supabaseClient = null;

if (window.supabase &&
    SUPABASE_PUBLISHABLE_KEY !== "YOUR_SUPABASE_PUBLISHABLE_KEY") {

  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
}

function getPostLoginTarget(nextPage, currentHref = window.location.href) {
  const current = new URL(currentHref);
  const appBasePath = new URL(".", current.href).pathname;
  const baseSegment = appBasePath.slice(1).endsWith("/") ? appBasePath.slice(1, -1) : appBasePath.slice(1);
  const fallback = new URL("dashboard.html", current.href);
  if (!nextPage) return fallback;
  try {
    const candidate = new URL(nextPage, current.href);
    const relativePath = candidate.pathname.slice(appBasePath.length);
    const duplicatedBase = baseSegment && relativePath.startsWith(baseSegment + "/");
    if (
      candidate.origin === current.origin &&
      candidate.pathname.startsWith(appBasePath) &&
      !duplicatedBase &&
      !candidate.pathname.endsWith("/login.html")
    ) return candidate;
  } catch (error) {}
  return fallback;
}

function togglePassword() { toggleFieldPassword("password", document.getElementById("passwordToggle")); }
function toggleFieldPassword(id, button) {
  const field = document.getElementById(id);
  const show = field.type === "password";
  field.type = show ? "text" : "password";
  button.textContent = show ? "Hide" : "Show";
  button.setAttribute("aria-pressed", String(show));
}
function passwordStrength(value) {
  let score = 0;
  if (value.length >= 8) score++;
  if (/[a-z]/.test(value) && /[A-Z]/.test(value)) score++;
  if (/\d/.test(value)) score++;
  if (/[^A-Za-z0-9]/.test(value)) score++;
  document.getElementById("strengthBar").style.width = (score * 25) + "%";
  document.getElementById("strengthBar").style.background = score <= 1 ? "#d94848" : score <= 2 ? "#d98b22" : "#16834a";
  document.getElementById("strengthLabel").textContent = value ? ["Very weak","Weak","Average","Good","Very strong"][score] : "Password strength";
}
document.getElementById("password").addEventListener("input", e => passwordStrength(e.target.value));
document.getElementById("confirmPassword").addEventListener("input", e => {
  e.target.setCustomValidity(e.target.value && e.target.value !== document.getElementById("password").value ? "Password does not match" : "");
});
document.getElementById("password").addEventListener("input", () => {
  const confirm = document.getElementById("confirmPassword");
  confirm.setCustomValidity(confirm.value && confirm.value !== document.getElementById("password").value ? "Password does not match" : "");
});
document.getElementById("forgotLink").addEventListener("click", async e => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim().toLowerCase();
  if (!email) { showMessage("Enter your email address first to reset your password."); document.getElementById("email").focus(); return; }
  if (!supabaseClient) { showMessage("Unable to connect to the authentication service."); return; }
  const link = document.getElementById("forgotLink");
  link.style.pointerEvents = "none"; link.textContent = "Sending...";
  try {
    const redirectTo = window.location.origin + window.location.pathname.replace(/login\.html$/, "reset-password.html");
    const {error} = await supabaseClient.auth.resetPasswordForEmail(email, {redirectTo});
    if (error) throw error;
    showMessage("A secure password reset link has been sent to your email. Check your inbox and spam folder.", true);
  } catch(error) { showMessage(error.message || "Unable to send the password reset email."); }
  finally { link.style.pointerEvents = ""; link.textContent = "Forgot Password?"; }
});

function chooseRole(role) {
  selectedRole = role;

  document.getElementById("seeker").classList.toggle("active",role==="job_seeker");
  document.getElementById("company").classList.toggle("active",role==="company");
  document.getElementById("seeker").setAttribute("aria-pressed",String(role==="job_seeker"));
  document.getElementById("company").setAttribute("aria-pressed",String(role==="company"));
}

function toggleMode() {
  isRegister = !isRegister;

  document.getElementById("heading").textContent =
    isRegister ? "Create a new account" : "Login to your account";

  document.getElementById("nameField").style.display =
    isRegister ? "block" : "none";

  document.getElementById("fullName").required = isRegister;
  document.getElementById("password").autocomplete = isRegister ? "new-password" : "current-password";
  document.getElementById("confirmWrap").style.display = isRegister ? "block" : "none";
  document.getElementById("confirmPassword").required = isRegister;
  document.getElementById("termsRow").style.display = isRegister ? "flex" : "none";
  document.getElementById("termsAgree").required = isRegister;
  document.getElementById("forgotLink").style.display = isRegister ? "none" : "inline";
  if (!isRegister) document.getElementById("resendBtn").style.display = "none";
  document.getElementById("passwordHint").textContent = isRegister ? "Use at least 8 characters, including uppercase, lowercase and a number" : "At least 8 characters";

  document.getElementById("submitBtn").textContent =
    isRegister ? "Register" : "Login";

  document.getElementById("switchText").textContent =
    isRegister ? "Already have an account?" : "Don't have an account?";

  document.getElementById("switchLink").textContent =
    isRegister ? "Login" : "Register";

  showMessage("");
}

function showMessage(message, success=false) {
  const box = document.getElementById("message");

  box.textContent = message;
  box.style.display = message ? "block" : "none";
  box.style.background = success ? "#e7f8ed" : "#fff0f0";
  box.style.color = success ? "#16743b" : "#b42318";
}


let resendCooldownTimer = null;
let resendSecondsRemaining = 0;

function startResendCooldown(seconds = 60) {
  const button = document.getElementById("resendBtn");
  if (resendCooldownTimer) clearInterval(resendCooldownTimer);
  resendSecondsRemaining = seconds;
  button.style.display = "block";
  button.disabled = true;
  button.textContent = `Wait ${resendSecondsRemaining} seconds before resending`;

  resendCooldownTimer = setInterval(() => {
    resendSecondsRemaining -= 1;
    if (resendSecondsRemaining <= 0) {
      clearInterval(resendCooldownTimer);
      resendCooldownTimer = null;
      button.disabled = false;
      button.textContent = "Didn't receive the email? Resend";
      return;
    }
    button.textContent = `Wait ${resendSecondsRemaining} seconds before resending`;
  }, 1000);
}

document.getElementById("resendBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim().toLowerCase();
  if (!email) { showMessage("Enter the email address you used to register."); return; }
  if (!supabaseClient) { showMessage("Unable to connect to the authentication service."); return; }

  const button = document.getElementById("resendBtn");
  button.disabled = true;
  button.textContent = "Email Sending...";
  try {
    const {error} = await supabaseClient.auth.resend({type:"signup", email});
    if (error) throw error;
    showMessage("Your request to resend the email has been accepted. Check your inbox, spam and promotions folders.", true);
    startResendCooldown(60);
  } catch(error) {
    showMessage(error.message || "Unable to send the email. Please try again later.");
    button.disabled = false;
    button.textContent = "Didn't receive the email? Resend";
  }
});

document.getElementById("authForm").addEventListener("submit",async function(e) {

  e.preventDefault();

  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  const fullName = document.getElementById("fullName").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value;
  if (isRegister && password !== confirmPassword) { showMessage("Both passwords must match."); return; }
  if (isRegister && (!/[a-z]/.test(password) || !/[A-Z]/.test(password) || !/\d/.test(password))) { showMessage("Your password must include at least one uppercase letter, one lowercase letter and one number."); return; }
  if (isRegister && !document.getElementById("termsAgree").checked) { showMessage("Please accept the Terms of Use and Privacy Policy to continue."); return; }

  if (!supabaseClient) {
    showMessage("Unable to connect to the authentication service. Check the publishable key.");
    return;
  }

  const button = document.getElementById("submitBtn");

  button.disabled = true;
  button.textContent = "Please wait...";

  showMessage("");

  try {

    if (isRegister) {

      const {data,error} = await supabaseClient.auth.signUp({

        email,
        password,

        options: {
          // Send email confirmation back to the deployed TAMILAN CAREERS page,
          // not Supabase's default localhost:3000 URL.
          emailRedirectTo: window.location.origin + window.location.pathname,
          data: {
            full_name: fullName,
            requested_account_type: selectedRole
          }
        }

      });

      if (error) throw error;

      if (data.session) {
        document.getElementById("resendBtn").style.display = "none";

        showMessage(
          "Your account has been created. Your account details must be verified.",
          true
        );

      } else {

        showMessage(
          "Registration submitted successfully. Open your email and confirm your address. If the email does not arrive, wait 60 seconds and use the button below to resend it.",
          true
        );
        startResendCooldown(60);

      }

    } else {

      const {data,error} = await supabaseClient.auth.signInWithPassword({

        email,
        password

      });

      if (error) throw error;

      showMessage(
        "Login successful. Opening your dashboard...",
        true
      );

      // Return to the requested in-site page after authentication.
      const nextPage = new URLSearchParams(window.location.search).get("next");
      window.location.replace(getPostLoginTarget(nextPage).href);

      return;
    }

  } catch(error) {

    showMessage(error.message || "Something went wrong.");

  } finally {

    button.disabled = false;
    button.textContent = isRegister ? "Register" : "Login";

  }

});

</script>
  <script src="assets/site-protection.js" defer></script>
</body>
  </html>
