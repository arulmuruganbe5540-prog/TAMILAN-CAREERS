<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Updates & Community Feedback | TAMILAN CAREERS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#17243e;font-family:Arial,"Noto Sans Tamil",sans-serif}header{background:#101d3a;color:#fff;padding:16px 5%;display:flex;justify-content:space-between;flex-wrap:wrap}header a{color:#fff}main{max-width:850px;margin:22px auto;padding:0 13px}.hero,.card{background:white;border:1px solid #e3eaf3;border-radius:15px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(110deg,#14264b,#2879cf,#7659d5);color:white}.card h2{font-size:19px;margin:7px 0}.meta,.tags{color:#71809a;font-size:12px}.tag{display:inline-block;padding:5px 8px;background:#edf4ff;color:#2767b0;border-radius:20px;margin:6px 4px 0 0;font-size:11px}.body{white-space:pre-wrap;line-height:1.8;margin:12px 0}.btn{border:0;padding:9px 12px;border-radius:8px;margin:4px;background:#eaf2ff;color:#24558e;font-weight:bold}.comment{border-top:1px solid #edf0f5;padding:10px 0;font-size:13px}.commentbox{display:flex;gap:7px;margin-top:10px}.commentbox input{flex:1;min-width:0;padding:10px;border:1px solid #d9e2ee;border-radius:8px}.primary{background:#2678e5;color:white}.muted{color:#78859a;font-size:12px}.empty{padding:25px;text-align:center;color:#71809a;background:#fff;border-radius:12px}

<script>const sb=window.supabase.createClient("https://qkmljuuusfjowexvybvy.supabase.co","sb_publishable_Wi6gltM_xFm1m4Dlgq727Q_83Rn58y2");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){const [{data:posts,error},{data:settings}]=await Promise.all([sb.from("community_posts").select("*").in("status",["published","scheduled"]).order("pinned",{ascending:false}).order("published_at",{ascending:false,nullsFirst:false}).limit(50),sb.from("community_settings").select("comments_enabled").eq("id",true).maybeSingle()]);if(error){document.getElementById("feed").textContent="Unable to load posts: "+error.message;return}if(!posts?.length){document.getElementById("feed").innerHTML='<div class="empty">There are no updates at the moment.</div>';return}let html="";for(const p of posts){const {data:comments}=await sb.from("community_post_comments").select("id,body,created_at").eq("post_id",p.id).eq("status","visible").order("created_at");const {data:reactions}=await sb.from("community_post_reactions").select("reaction").eq("post_id",p.id);let likes=(reactions||[]).filter(x=>x.reaction==="like").length,dislikes=(reactions||[]).filter(x=>x.reaction==="dislike").length;const open=Boolean(settings?.comments_enabled&&p.comments_enabled);html+='<article class="card"><div class="meta">'+esc(p.post_type.replaceAll("_"," "))+' · '+new Date(p.published_at||p.scheduled_at||p.created_at).toLocaleString()+(p.pinned?" · 📌 Pinned post":"")+'</div><h2>'+esc(p.title)+'</h2><div class="tags">'+(p.tags||[]).map(t=>'<span class="tag">#'+esc(t)+'</span>').join("")+'</div><div class="body">'+esc(p.body)+'</div>'+(p.attachment_url?'<p><a target="_blank" rel="noopener" href="'+esc(p.attachment_url)+'">📎 Attachment / PDF திறக்க</a></p>':"")+(p.link_url?'<p><a target="_blank" rel="noopener" href="'+esc(p.link_url)+'">Open Official Link</a></p>':"")+'<button class="btn" onclick="react(\''+p.id+'\',\'like\')">👍 Like '+likes+'</button><button class="btn" onclick="react(\''+p.id+'\',\'dislike\')">👎 Dislike '+dislikes+'</button><h3>Community Comments ('+(comments||[]).length+')</h3>'+(open?'<div id="comments-'+p.id+'">'+(comments||[]).map(c=>'<div class="comment">'+esc(c.body)+'<div class="muted">'+new Date(c.created_at).toLocaleString()+'</div></div>').join("")+'</div><div class="commentbox"><input id="input-'+p.id+'" maxlength="3000" placeholder="Write your comment"><button class="btn primary" onclick="comment(\''+p.id+'\')">Send</button></div>':'<p class="muted">Comments are temporarily disabled for this post.</p>')+'</article>'}document.getElementById("feed").innerHTML=html}
window.comment=async id=>{const {data:{user}}=await sb.auth.getUser();if(!user){alert("Please log in to comment.");location.href="login.html";return}const input=document.getElementById("input-"+id),body=input.value.trim();if(!body)return;const {error}=await sb.from("community_post_comments").insert({post_id:id,user_id:user.id,body});if(error){alert("Unable to post comment: "+error.message);return}input.value="";await load()};
window.react=async(id,reaction)=>{const {data:{user}}=await sb.auth.getUser();if(!user){alert("Please log in to like or dislike this post.");location.href="login.html";return}const {error}=await sb.from("community_post_reactions").upsert({post_id:id,user_id:user.id,reaction},{onConflict:"post_id,user_id"});if(error)alert(error.message);else await load()};
load();
</script>  <script src="assets/site-protection.js" defer></script>
