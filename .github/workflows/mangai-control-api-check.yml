name: Mangaiyarkarasi Control API Checks
# Keep this workflow scoped to control API, migration, and security-test changes.

on:
  pull_request:
    paths:
      - "supabase/functions/mangai-control-api/**"
      - "supabase/migrations/*mangaiyarkarasi*"
      - "supabase/tests/mangaiyarkarasi*"
      - "supabase/config.toml"
      - ".github/workflows/mangai-control-api-check.yml"
  push:
    branches:
      - "mangaiyarkarasi/**"
    paths:
      - "supabase/functions/mangai-control-api/**"
      - "supabase/migrations/*mangaiyarkarasi*"
      - "supabase/tests/mangaiyarkarasi*"
      - "supabase/config.toml"
      - ".github/workflows/mangai-control-api-check.yml"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format check
        run: deno fmt --check supabase/functions/mangai-control-api/index.ts supabase/functions/mangai-control-api/policy.ts supabase/functions/mangai-control-api/policy_test.ts supabase/functions/mangai-control-api/handler_test.ts
      - name: Lint
        run: deno lint supabase/functions/mangai-control-api/index.ts supabase/functions/mangai-control-api/policy.ts supabase/functions/mangai-control-api/policy_test.ts
      - name: Type-check control API
        run: deno check --config supabase/functions/mangai-control-api/deno.json supabase/functions/mangai-control-api/index.ts
      - name: Run authorization policy unit tests
        run: deno test --config supabase/functions/mangai-control-api/deno.json supabase/functions/mangai-control-api/policy_test.ts supabase/functions/mangai-control-api/handler_test.ts
      - name: Verify database smoke test contains fail-fast security assertions
        run: |
          grep -q "Expected exactly one Master Owner binding" supabase/tests/mangaiyarkarasi_control_foundation_smoke.sql
          grep -q "RLS is not enabled on every Mangai control table" supabase/tests/mangaiyarkarasi_control_foundation_smoke.sql
          grep -q "Audit events are not append-only" supabase/tests/mangaiyarkarasi_control_foundation_smoke.sql
          grep -q "Untrusted roles can execute the proposal decision RPC" supabase/tests/mangaiyarkarasi_control_foundation_smoke.sql
          grep -q "mangai_record_proposal_decision" supabase/migrations/20261126150000_mangaiyarkarasi_control_foundation.sql
          grep -q "mangai_set_module_enabled" supabase/migrations/20261126150000_mangaiyarkarasi_control_foundation.sql
          grep -q "mangai_create_change_proposal" supabase/migrations/20261126150000_mangaiyarkarasi_control_foundation.sql
          grep -q '"mangai_set_module_enabled"' supabase/functions/mangai-control-api/index.ts
          grep -q '"mangai_create_change_proposal"' supabase/functions/mangai-control-api/index.ts
          grep -q "Module control RPC grants are incorrect" supabase/tests/mangaiyarkarasi_control_foundation_smoke.sql
          grep -q "Proposal creation RPC grants are incorrect" supabase/tests/mangaiyarkarasi_control_foundation_smoke.sql
          grep -q "getAuthenticatorAssuranceLevel" supabase/functions/mangai-control-api/index.ts
          grep -q "hasWriteAssurance" supabase/functions/mangai-control-api/index.ts
          grep -q "authorizeMasterOwner" supabase/functions/mangai-control-api/index.ts
          grep -q "isProtectedModuleControl" supabase/functions/mangai-control-api/index.ts
          grep -q "isProductionReleaseAction" supabase/functions/mangai-control-api/index.ts
          grep -q "hasWriteAssurance" supabase/functions/mangai-control-api/policy_test.ts
          grep -q "createControlApiHandler" supabase/functions/mangai-control-api/index.ts
          grep -q "Owner with AAL2 can submit an allow-listed proposal request" supabase/functions/mangai-control-api/handler_test.ts

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare isolated Supabase-compatible test roles and Owner fixture
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE service_role NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          CREATE TABLE public.user_roles (
            user_id uuid NOT NULL,
            role text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT now(),
            PRIMARY KEY (user_id, role)
          );
          INSERT INTO public.user_roles (user_id, role)
          VALUES ('11111111-1111-4111-8111-111111111111', 'super_admin');
          SQL
      - name: Apply additive control migration to ephemeral PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261126150000_mangaiyarkarasi_control_foundation.sql
      - name: Run RLS, grants and append-only smoke assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mangaiyarkarasi_control_foundation_smoke.sql
      - name: Verify transactional RPC success and audit-failure rollback
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mangaiyarkarasi_control_transactions.sql
