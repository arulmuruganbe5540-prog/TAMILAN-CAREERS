name: Mangaiyarkarasi Control API Checks
# Keep this workflow scoped to control API, migration, and security-test changes.

on:
  pull_request:
    paths:
      - "supabase/functions/mangai-control-api/**"
      - "supabase/migrations/*mangaiyarkarasi*"
      - "supabase/tests/mangaiyarkarasi*"
      - "supabase/config.toml"
      - ".github/workflows/mangai-control-api-check.yml"
  push:
    branches:
      - "mangaiyarkarasi/**"
    paths:
      - "supabase/functions/mangai-control-api/**"
      - "supabase/migrations/*mangaiyarkarasi*"
      - "supabase/tests/mangaiyarkarasi*"
      - "supabase/config.toml"
      - ".github/workflows/mangai-control-api-check.yml"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format check
        run: deno fmt --check supabase/functions/mangai-control-api/index.ts supabase/functions/mangai-control-api/policy.ts supabase/functions/mangai-control-api/policy_test.ts supabase/functions/mangai-control-api/handler_test.ts supabase/functions/mangai-control-api/local_auth_mfa_integration_test.ts
      - name: Lint
        run: deno lint supabase/functions/mangai-control-api/index.ts supabase/functions/mangai-control-api/policy.ts supabase/functions/mangai-control-api/policy_test.ts supabase/functions/mangai-control-api/handler_test.ts supabase/functions/mangai-control-api/local_auth_mfa_integration_test.ts
      - name: Type-check control API
        run: deno check --config supabase/functions/mangai-control-api/deno.json supabase/functions/mangai-control-api/index.ts supabase/functions/mangai-control-api/local_auth_mfa_integration_test.ts
      - name: Run authorization policy unit tests
        run: deno test --config supabase/functions/mangai-control-api/deno.json supabase/functions/mangai-control-api/policy_test.ts supabase/functions/mangai-control-api/handler_test.ts
      - name: Verify database smoke test contains fail-fast security assertions
        run: |
          grep -q "Expected exactly one Master Owner binding" supabase/tests/mangaiyarkarasi_control_foundation_smoke.sql
          grep -q "RLS is not enabled on every Mangai control table" supabase/tests/mangaiyarkarasi_control_foundation_smoke.sql
          grep -q "Audit events are not append-only" supabase/tests/mangaiyarkarasi_control_foundation_smoke.sql
          grep -q "Untrusted roles can execute the proposal decision RPC" supabase/tests/mangaiyarkarasi_control_foundation_smoke.sql
          grep -q "mangai_record_proposal_decision" supabase/migrations/20261126150000_mangaiyarkarasi_control_foundation.sql
          grep -q "mangai_set_module_enabled" supabase/migrations/20261126150000_mangaiyarkarasi_control_foundation.sql
          grep -q "mangai_create_change_proposal" supabase/migrations/20261126150000_mangaiyarkarasi_control_foundation.sql
          grep -q '"mangai_set_module_enabled"' supabase/functions/mangai-control-api/index.ts
          grep -q '"mangai_create_change_proposal"' supabase/functions/mangai-control-api/index.ts
          grep -q "Module control RPC grants are incorrect" supabase/tests/mangaiyarkarasi_control_foundation_smoke.sql
          grep -q "Proposal creation RPC grants are incorrect" supabase/tests/mangaiyarkarasi_control_foundation_smoke.sql
          grep -q "readValidatedJwtAal" supabase/functions/mangai-control-api/index.ts
          grep -q "hasWriteAssurance" supabase/functions/mangai-control-api/index.ts
          grep -q "authorizeMasterOwner" supabase/functions/mangai-control-api/index.ts
          grep -q "isProtectedModuleControl" supabase/functions/mangai-control-api/index.ts
          grep -q "isProductionReleaseAction" supabase/functions/mangai-control-api/index.ts
          grep -q "hasWriteAssurance" supabase/functions/mangai-control-api/policy_test.ts
          grep -q "createControlApiHandler" supabase/functions/mangai-control-api/index.ts
          grep -q "Owner with AAL2 can submit an allow-listed proposal request" supabase/functions/mangai-control-api/handler_test.ts

  local-supabase-auth-mfa-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI v3
        uses: supabase/setup-cli@v2
        with:
          version: 3.0.0
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build a disposable local Supabase project
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT="$RUNNER_TEMP/mangai-local-supabase"
          mkdir -p "$TEST_ROOT/supabase/migrations" "$TEST_ROOT/supabase/functions"
          cp supabase/config.toml "$TEST_ROOT/supabase/config.toml"
          cp supabase/migrations/20261126150000_mangaiyarkarasi_control_foundation.sql "$TEST_ROOT/supabase/migrations/"
          cp -R supabase/functions/mangai-control-api "$TEST_ROOT/supabase/functions/"
          cat > "$TEST_ROOT/supabase/migrations/20261126145900_local_auth_owner_fixture.sql" <<'SQL'
          create table public.user_roles (
            user_id uuid not null,
            role text not null,
            created_at timestamptz not null default now(),
            primary key (user_id, role)
          );

          insert into public.user_roles(user_id, role)
          values ('11111111-1111-4111-8111-111111111111', 'super_admin');
          SQL
          echo "TEST_ROOT=$TEST_ROOT" >> "$GITHUB_ENV"
      - name: Start isolated local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          cd "$TEST_ROOT"
          supabase start --exclude imgproxy,logflare,mailpit,postgres-meta,realtime,storage-api,studio,supavisor,vector
          supabase db reset
          supabase status -o env > "$RUNNER_TEMP/mangai-supabase-status.env"
          set -a
          source "$RUNNER_TEMP/mangai-supabase-status.env"
          set +a
          test -n "$API_URL" && test "$API_URL" != "null"
          test -n "$ANON_KEY" && test "$ANON_KEY" != "null"
          test -n "$SERVICE_ROLE_KEY" && test "$SERVICE_ROLE_KEY" != "null"
          cat > "$TEST_ROOT/supabase/functions/.env" <<EOF
          SUPABASE_URL=$API_URL
          SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          EOF
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "MANGAI_FUNCTION_URL=$API_URL/functions/v1/mangai-control-api"
          } >> "$GITHUB_ENV"
      - name: Serve the Edge Function in Supabase Edge Runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$TEST_ROOT"
          nohup supabase functions serve mangai-control-api --env-file "$TEST_ROOT/supabase/functions/.env" > "$RUNNER_TEMP/mangai-edge-runtime.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mangai-edge-runtime.pid"
          for attempt in $(seq 1 60); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "apikey: $SUPABASE_ANON_KEY" -H "Origin: https://tamilancareers.in" "$MANGAI_FUNCTION_URL" || true)"
            if [ "$code" != "000" ] && [ "$code" != "502" ] && [ "$code" != "503" ]; then
              echo "Local Edge Function gateway responded with HTTP $code"
              exit 0
            fi
            echo "Waiting for Edge Function runtime (attempt $attempt/60, HTTP $code)"
            sleep 2
          done
          cat "$RUNNER_TEMP/mangai-edge-runtime.log"
          echo "Local Edge Function runtime did not become ready"
          exit 1
      - name: Exercise real local Auth, TOTP MFA and Edge Function request path
        run: |
          deno test --allow-env --allow-net --allow-read --config "$TEST_ROOT/supabase/functions/mangai-control-api/deno.json" "$TEST_ROOT/supabase/functions/mangai-control-api/local_auth_mfa_integration_test.ts"
      - name: Stop disposable local Supabase stack
        if: always()
        shell: bash
        run: |
          if [ -n "${TEST_ROOT:-}" ] && [ -f "$TEST_ROOT/supabase/config.toml" ]; then
            cd "$TEST_ROOT"
            supabase stop --no-backup || true
          fi

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare isolated Supabase-compatible test roles and Owner fixture
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE service_role NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          CREATE TABLE public.user_roles (
            user_id uuid NOT NULL,
            role text NOT NULL,
            created_at timestamptz NOT NULL DEFAULT now(),
            PRIMARY KEY (user_id, role)
          );
          INSERT INTO public.user_roles (user_id, role)
          VALUES ('11111111-1111-4111-8111-111111111111', 'super_admin');
          SQL
      - name: Apply additive control migration to ephemeral PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261126150000_mangaiyarkarasi_control_foundation.sql
      - name: Run RLS, grants and append-only smoke assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mangaiyarkarasi_control_foundation_smoke.sql
      - name: Verify transactional RPC success and audit-failure rollback
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mangaiyarkarasi_control_transactions.sql
