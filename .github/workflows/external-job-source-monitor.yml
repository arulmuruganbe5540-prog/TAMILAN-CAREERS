name: Official external job source discovery
on:
  schedule:
    - cron: "41 */8 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call protected Supabase source scanner
        env:
          MONITOR_SECRET: ${{ secrets.GOVERNMENT_MONITOR_SECRET }}
        run: |
          if [ -z "$MONITOR_SECRET" ]; then
            echo "GOVERNMENT_MONITOR_SECRET is not configured; source sync skipped."
            exit 0
          fi
          curl --fail --show-error --silent --max-time 300 \
            -X POST "https://qkmljuuusfjowexvybvy.supabase.co/functions/v1/scan-external-job-sources" \
            -H "x-monitor-secret: $MONITOR_SECRET" \
            -H "Content-Type: application/json" --data '{}'
