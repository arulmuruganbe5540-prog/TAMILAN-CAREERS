name: Refresh published jobs sitemap

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-sitemap.mjs"
      - ".github/workflows/update-sitemap.yml"
      - "admin-job-post.html"
      - "company-jobs.html"

permissions:
  contents: write

concurrency:
  group: published-jobs-sitemap
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Generate sitemap from public published jobs
        run: node scripts/generate-sitemap.mjs

      - name: Commit sitemap when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "Sitemap is already current."
          else
            git commit -m "Refresh published jobs sitemap"
            git push
          fi
