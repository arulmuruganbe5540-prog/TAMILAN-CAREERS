name: Frequent official government recruitment monitor
on:
  push:
    paths:
      - 'scripts/government-job-monitor.py'
      - 'scripts/government-source-discovery.py'
      - 'data/government-official-sources.json'
      - 'supabase/functions/ingest-government-notices/**'
      - '.github/workflows/government-job-monitor.yml'
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
concurrency:
  group: repository-maintenance-commits
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      GOVERNMENT_MONITOR_SECRET: ${{ secrets.GOVERNMENT_MONITOR_SECRET }}
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Python syntax
        run: python -m py_compile scripts/government-job-monitor.py scripts/government-source-discovery.py
      - name: Scan registered official recruiting authorities
        run: python scripts/government-job-monitor.py
      - name: Discover possible new official recruiting portals
        run: python scripts/government-source-discovery.py
      - name: Sync up to 15 recruitment candidates to Supabase Admin Review
        if: ${{ env.GOVERNMENT_MONITOR_SECRET != '' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          queue = json.loads(Path("government-job-review-queue.json").read_text(encoding="utf-8"))
          candidates = []
          for item in queue.get("items", []):
              if item.get("status") != "pending_admin_verification":
                  continue
              candidates.append({
                  "source_id": item.get("source_id"),
                  "title": item.get("title"),
                  "official_url": item.get("official_url"),
                  "category_hint": item.get("category_hint", "other"),
                  "discovered_at_utc": item.get("discovered_at_utc"),
              })
              if len(candidates) >= 15:
                  break
          Path("/tmp/government-notice-sync-payload.json").write_text(
              json.dumps({"candidates": candidates}, ensure_ascii=False),
              encoding="utf-8"
          )
          print(f"Prepared {len(candidates)} candidates for secure Admin Review sync.")
          PY
          curl --fail --show-error --silent --max-time 120 \
            -X POST "https://qkmljuuusfjowexvybvy.supabase.co/functions/v1/ingest-government-notices" \
            -H "x-monitor-secret: ${GOVERNMENT_MONITOR_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/government-notice-sync-payload.json \
            -o /tmp/government-notice-sync-response.json
          python - <<'PY'
          import json
          from pathlib import Path
          response = json.loads(Path("/tmp/government-notice-sync-response.json").read_text(encoding="utf-8"))
          synced = set(response.get("synced_official_urls", []))
          queue_path = Path("government-job-review-queue.json")
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          now = __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat()
          marked = 0
          for item in queue.get("items", []):
              if item.get("official_url") in synced:
                  item["status"] = "synced_pending_review"
                  item["synced_to_supabase_at_utc"] = now
                  marked += 1
          queue["pending_review"] = sum(1 for item in queue.get("items", []) if item.get("status") == "pending_admin_verification")
          queue["synced_pending_review"] = sum(1 for item in queue.get("items", []) if item.get("status") == "synced_pending_review")
          queue_path.write_text(json.dumps(queue, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Synced {marked} official URLs to the Supabase Admin Review queue.")
          print(json.dumps(response, ensure_ascii=False))
          PY
      # Run AI extraction after ingestion so fresh candidates are included in the same monitor cycle.
      - name: AI extract official notice details for Admin Review
        if: ${{ env.GOVERNMENT_MONITOR_SECRET != '' }}
        continue-on-error: true
        run: |
          curl --fail --show-error --silent --max-time 600 \
            -X POST "https://qkmljuuusfjowexvybvy.supabase.co/functions/v1/extract-government-notice-details" \
            -H "x-monitor-secret: ${GOVERNMENT_MONITOR_SECRET}" \
            -H "Content-Type: application/json" \
            --data '{}'
      - name: Commit aggregate monitor report only
        run: |
          git add government-job-monitor-report.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh official government job review queue"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No review queue changes."
          fi
