name: Frequent official government recruitment monitor
on:
  push:
    paths:
      - 'scripts/government-job-monitor.py'
      - 'scripts/government-source-discovery.py'
      - 'data/government-official-sources.json'
      - '.github/workflows/government-job-monitor.yml'
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
concurrency:
  group: official-government-monitor
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Python syntax
        run: python -m py_compile scripts/government-job-monitor.py scripts/government-source-discovery.py
      - name: Scan registered official recruiting authorities
        run: python scripts/government-job-monitor.py
      - name: Discover possible new official recruiting portals
        run: python scripts/government-source-discovery.py
      - name: Commit review queues and monitor reports
        run: |
          git add government-job-review-queue.json government-job-monitor-report.json government-source-discovery-candidates.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh official government job review queue"
            git push
          else
            echo "No review queue changes."
          fi
