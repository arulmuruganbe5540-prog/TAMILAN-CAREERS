name: Daily TAMILAN CAREERS website health check

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "*.html"
      - "*.js"
      - "assets/**"
      - "data/**"
      - "supabase-*.sql"
      - "scripts/**"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".gitignore"
      - ".github/dependabot.yml"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: website-health-check
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js for JavaScript syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Deno for Supabase Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check all tracked Supabase Edge Functions
        run: |
          deno check supabase/functions/bilingual-job-search/index.ts
          deno check supabase/functions/ai-resume-match/index.ts
          deno check supabase/functions/company-resume-access/index.ts
          deno check supabase/functions/company-members/index.ts
          deno check supabase/functions/ingest-government-notices/index.ts
          deno check supabase/functions/scan-external-job-sources/index.ts
          deno check supabase/functions/extract-government-notice-details/index.ts
          deno check supabase/functions/generate-job-mock-exam/index.ts
          deno check supabase/functions/tamilan-ai-job-context/index.ts
      - name: Validate audit script
        run: python -m py_compile scripts/website-health-check.py
      - name: Lint SQL migration dollar quoting
        run: python scripts/sql-migration-lint.py
      - name: Guard private government candidate files
        run: python scripts/private-artifact-guard.py
      - name: Guard company job draft and Admin publication workflow
        run: python scripts/job-publishing-workflow-guard.py
      - name: Guard private Resume storage and employer access workflow
        run: python scripts/resume-security-workflow-guard.py
      - name: Validate public government feed JavaScript
        run: node --check government-notices-public.js
      - name: Guard Super Admin MFA enrollment, sign-in and page access
        run: python scripts/admin-mfa-guard.py
      - name: Guard Super Admin external job candidate review
        run: python scripts/external-job-review-guard.py
      - name: Guard staged TAMILAN AI rollout and browser secret boundary
        run: python scripts/tamilan-ai-safety-guard.py
      - name: Guard read-only TAMILAN AI job retrieval contract
        run: python scripts/tamilan-ai-retrieval-guard.py
      - name: Check internal website structure
        run: python scripts/website-health-check.py
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run key-page browser smoke tests
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/tc-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
          node scripts/browser-smoke-test.mjs
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamilan-careers-health-report
          path: website-health-report.json
          if-no-files-found: warn
          retention-days: 30
