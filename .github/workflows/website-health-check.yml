name: Daily TAMILAN CAREERS website health check

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "*.html"
      - "scripts/**"
      - ".github/workflows/website-health-check.yml"

permissions:
  contents: write

concurrency:
  group: website-health-check
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js for JavaScript syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate audit script
        run: python -m py_compile scripts/website-health-check.py
      - name: Check internal website structure
        run: python scripts/website-health-check.py
      - name: Save health report
        if: always()
        run: |
          if [ -f website-health-report.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add website-health-report.json
            if ! git diff --cached --quiet; then
              git commit -m "Update daily website health report"
              git push
            fi
          fi
