name: Daily TAMILAN CAREERS website health check

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "*.html"
      - "scripts/**"
      - "supabase/functions/**"
      - ".github/dependabot.yml"
      - ".github/workflows/website-health-check.yml"

permissions:
  contents: read

concurrency:
  group: repository-maintenance-commits
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js for JavaScript syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Deno for Supabase Edge Function checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check AI Edge Functions
        run: |
          deno check supabase/functions/bilingual-job-search/index.ts
          deno check supabase/functions/ai-resume-match/index.ts
          deno check supabase/functions/ingest-government-notices/index.ts
      - name: Validate audit script
        run: python -m py_compile scripts/website-health-check.py
      - name: Check internal website structure
        run: python scripts/website-health-check.py
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run key-page browser smoke tests
        run: |
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/tc-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/index.html >/dev/null
          node scripts/browser-smoke-test.mjs
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamilan-careers-health-report
          path: website-health-report.json
          if-no-files-found: warn
          retention-days: 30
