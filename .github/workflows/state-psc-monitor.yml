name: Daily State PSC source monitor
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/state-job-monitor.py"
      - ".github/workflows/state-psc-monitor.yml"
permissions:
  contents: write

concurrency:
  group: repository-maintenance-commits
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate monitor syntax
        run: python -m py_compile scripts/state-job-monitor.py
      - name: Check official State PSC pages
        run: python scripts/state-job-monitor.py
      - name: Commit source-change report when updated
        run: |
          git add state-job-monitor-report.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update daily State PSC source monitor report"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No source-monitor report changes to commit."
          fi
