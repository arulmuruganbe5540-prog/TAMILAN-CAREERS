<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="googlebot" content="noindex,nofollow,noarchive">
<title>Super Admin Sign In | TAMILAN CAREERS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#071426;--panel:#10243d;--line:#244362;--blue:#168bd2;--cyan:#65d7ff;--muted:#a8bed2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#12365a 0,#071426 58%);font:15px Arial,sans-serif;color:#f2f8ff;display:grid;place-items:center;padding:18px}
main{width:min(100%,440px);background:rgba(16,36,61,.97);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 20px 60px #0008}
.brand{font-size:13px;letter-spacing:2px;color:var(--cyan);font-weight:800}.lock{font-size:32px;margin:18px 0 6px}h1{font-size:23px;margin:0 0 8px}p{color:var(--muted);line-height:1.55}.field{margin:15px 0}label{display:block;margin-bottom:7px;font-weight:700;font-size:13px}input{width:100%;padding:13px;border:1px solid #3b5a79;border-radius:8px;background:#08192c;color:#fff;font-size:16px}button{width:100%;border:0;border-radius:8px;padding:13px;background:linear-gradient(100deg,#0878bd,#16a6c9);color:white;font-weight:800;font-size:15px;margin-top:12px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#244362}.notice{display:none;padding:12px;border-radius:8px;margin:15px 0;line-height:1.5;background:#183b55;color:#d9f3ff}.notice.show{display:block}.notice.error{background:#512a32;color:#ffe0e4}.notice.success{background:#174b3c;color:#d9ffeb}.panel{display:none}.panel.show{display:block}.links{display:flex;gap:12px;margin-top:16px}.links button{font-size:13px;padding:10px}
</style><script src="admin-language.js" defer></script></head><body><main>
<div class="brand">TAMILAN CAREERS · PRIVATE AREA</div><div class="lock">🔐</div>
<h1>Super Admin Sign In</h1>
<p>Sign in with your email and password. Access is granted only to accounts authorized as Super Admin in the database.</p>
<div id="notice" class="notice" role="status"></div>
<section id="loginPanel" class="panel show">
<form id="loginForm">
<div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required></div>
<button id="loginBtn">Sign In</button>
</form>
<button id="resetBtn" class="secondary" type="button">Forgot Password? Reset</button>
</section>


<section id="recoverPanel" class="panel">
<h2>Set a New கடவுச்சொல்</h2><p>Open the password reset link sent to your email, then set a new password here.</p>
<form id="recoverForm"><div class="field"><label for="newகடவுச்சொல்">New கடவுச்சொல்</label><input id="newகடவுச்சொல்" type="password" minlength="8" autocomplete="new-password" required></div><button id="saveகடவுச்சொல்Btn">கடவுச்சொல் சேமிக்கவும்</button></form>
</section>
</main>
<script>
(()=>{
const SB_URL='https://qkmljuuusfjowexvybvy.supabase.co';
const SB_KEY='sb_publishable_Wi6gltM_xFm1m4Dlgq727Q_83Rn58y2';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
function note(msg,type=''){ $('notice').textContent=msg;$('notice').className='notice show '+type; }
function show(which){['loginPanel','recoverPanel'].forEach(id=>$(id).classList.toggle('show',id===which));}

function busy(id,on){$(id).disabled=on;}
async function checkAdmin(){
 const {data:{user},error:userError}=await sb.auth.getUser();
 if(userError||!user)throw new Error('Sign-in session not found. Please sign in again.');
 const {data,error}=await sb.from('user_roles').select('role').eq('user_id',user.id).eq('role','super_admin').limit(1);
 if(error)throw error;
 if(!data||data.length!==1)throw new Error('This email account does not have Super Admin permission.');

 note('Sign-in successful. Opening the Super Admin dashboard.','success');location.href='super-admin.html';
}
$('resetBtn').addEventListener('click',async()=>{
 try{
  const email=$('email').value.trim();
  if(!email)throw new Error('Enter your email address first.');
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  if(error)throw error;
  note('Password reset link sent to your email. Check your inbox and spam folder.','success');
 }catch(err){note(err.message||'Unable to send the reset email.','error');}
});
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();busy('loginBtn',true);
 try{
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  if(error)throw error;
  await checkAdmin();
 }catch(err){show('loginPanel');note(err.message||'Sign-in failed.','error');}
 finally{busy('loginBtn',false);}
});
$('recoverForm').addEventListener('submit',async e=>{
 e.preventDefault();busy('saveகடவுச்சொல்Btn',true);
 try{
  const password=$('newகடவுச்சொல்').value;
  if(password.length<8)throw new Error('Use a password with at least 8 characters.');
  const {error}=await sb.auth.updateUser({password});
  if(error)throw error;
  await sb.auth.signOut();show('loginPanel');note('New password saved. Please sign in.','success');
 }catch(err){note(err.message||'கடவுச்சொல் update failed.','error');}
 finally{busy('saveகடவுச்சொல்Btn',false);}
});
sb.auth.onAuthStateChange((event,session)=>{
 if(event==='PASSWORD_RECOVERY'&&session){show('recoverPanel');note('Set a New கடவுச்சொல்.');}
});
sb.auth.getSession().then(async({data,error})=>{
 if(error||!data.session)return;
 if(location.search.includes('code=')||location.hash.includes('type=recovery')){show('recoverPanel');note('Set a New கடவுச்சொல்.');return;}
 try{await checkAdmin();}catch(err){await sb.auth.signOut();show('loginPanel');note(err.message||'Access denied.','error');}
});
})();
</script></body></html>
