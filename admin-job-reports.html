<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="theme-color" content="#101d3a"><title>Job Reports | TAMILAN CAREERS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17233d;font-family:Arial,"Noto Sans Tamil",sans-serif;line-height:1.6}header{background:#101d3a;color:white;padding:15px 5%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}header a{color:#8edcff;text-decoration:none}main{max-width:1100px;margin:24px auto;padding:0 14px}.panel,.report{background:white;border:1px solid #e1e8f1;border-radius:13px;padding:17px;margin-bottom:13px}.muted{color:#718097;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tag{background:#edf3fa;border-radius:20px;padding:4px 9px;font-size:12px}.btn{border:0;border-radius:8px;padding:9px 13px;background:#1688ed;color:white;font-weight:bold;cursor:pointer}.btn.secondary{background:#eaf2fb;color:#175b99}textarea,select{width:100%;padding:10px;border:1px solid #ccd8e6;border-radius:8px;font:inherit;margin:6px 0}.report h2{font-size:17px;margin:0}.report p{margin:6px 0}.empty{padding:28px;text-align:center;color:#718097;background:white;border-radius:12px}
</style><link rel="stylesheet" href="assets/site-protection.css"><style>
/* Consistent premium text-only site identity */
.tc-domain-brand{display:inline-block!important;color:#eaf8ff!important;font-size:clamp(13px,2vw,19px)!important;font-weight:900!important;letter-spacing:.8px!important;line-height:1.2!important;white-space:nowrap!important;text-decoration:none!important;text-shadow:0 1px 10px rgba(72,190,255,.16)}
@media(max-width:480px){.tc-domain-brand{font-size:12px!important;letter-spacing:.35px!important}}
</style></head><body>
<header><b>🛡 <span class="tc-domain-brand">WWW.TAMILANCAREERS.IN</span> — Job Reports</b><a href="admin-control.html">← Admin Control</a></header>
<main><section class="panel"><h1 style="margin:0">Job Reports</h1><p class="muted">Review user reports and record the action taken. A job is not automatically removed just because a report is received.</p><div class="row"><span id="summary" class="tag">Checking…</span><button id="refresh" class="btn secondary">Refresh</button></div></section><div id="message" class="panel">Checking Admin permissions…</div><div id="reports"></div></main>
<script>
const db=window.supabase.createClient("https://qkmljuuusfjowexvybvy.supabase.co","sb_publishable_Wi6gltM_xFm1m4Dlgq727Q_83Rn58y2");
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reasonNames={upfront_payment:"Advance / Registration Fee",fake_or_misleading:"Fake / Misleading Notice",identity_impersonation:"Impersonation",personal_data_request:"Inappropriate Request for Personal Information",expired_or_filled:"Expired / Filled Job",other:"Other"};
let allowed=false;
async function init(){
 const {data:s}=await db.auth.getSession();if(!s.session){location.replace("login.html?next="+encodeURIComponent("admin-job-reports.html"));return}
 const {data:r,error}=await db.from("user_roles").select("role").eq("user_id",s.session.user.id).eq("role","super_admin").maybeSingle();
 if(error||!r){$("message").textContent="Super Admin access required.";return}
 const {data:aal,error:ae}=await db.auth.mfa.getAuthenticatorAssuranceLevel();if(ae||aal?.currentLevel!=="aal2"){$("message").textContent="Authenticator MFA verification is required. Please sign in again through Admin Login.";return}
 allowed=true;$("message").textContent="Administrator access confirmed.";await load();
}
async function load(){
 if(!allowed)return;
 $("reports").textContent="Loading reports…";

 const specs=[
  {system:"legacy",reports:"job_reports",jobs:"jobs",review:"tc_review_job_report"},
  {system:"government",reports:"government_job_reports",jobs:"government_jobs",review:"tc_review_government_job_report"},
  {system:"private",reports:"private_job_reports",jobs:"private_jobs",review:"tc_review_private_job_report"},
  {system:"international",reports:"international_job_reports",jobs:"international_jobs",review:"tc_review_international_job_report"}
 ];
 const loaded=await Promise.all(specs.map(async spec=>{
  const {data,error}=await db.from(spec.reports).select("id,job_id,reporter_user_id,reason,details,status,admin_note,created_at,reviewed_at").order("created_at",{ascending:false}).limit(150);
  if(error)return {spec,error};
  const ids=[...new Set((data||[]).map(x=>x.job_id))];
  const jobs=ids.length?await db.from(spec.jobs).select("id,job_title,job_code,job_kind,employer_name,company_id").in("id",ids):{data:[],error:null};
  if(jobs.error)return {spec,error:jobs.error};
  const map=new Map((jobs.data||[]).map(j=>[j.id,j]));
  return {spec,rows:(data||[]).map(x=>({...x,_system:spec.system,_review:spec.review,job:map.get(x.job_id)||null}))};
 }));
 const failed=loaded.find(x=>x.error);
 if(failed){$("reports").textContent="Unable to load "+failed.spec.system+" reports: "+failed.error.message;return}
 const items=loaded.flatMap(x=>x.rows||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
 const pending=items.filter(x=>x.status==="pending").length;
 $("summary").textContent="Total "+items.length+" · Pending "+pending;
 if(!items.length){$("reports").innerHTML='<div class="empty">There are no reports yet.</div>';return}
 $("reports").innerHTML=items.map(x=>{
  const j=x.job;
  return '<article class="report"><div class="row"><h2>'+esc(j?.job_title||"Job removed")+'</h2><span class="tag">'+esc(x.status)+'</span><span class="tag">'+esc(reasonNames[x.reason]||x.reason)+'</span><span class="tag">'+esc(x._system)+'</span></div><p class="muted">Job Code: '+esc(j?.job_code||x.job_id)+' · Report Date: '+new Date(x.created_at).toLocaleString("en-IN")+' · Reporter ID: '+esc(x.reporter_user_id)+'</p><p><b>Employer:</b> '+esc(j?.employer_name||"—")+' · <b>Type:</b> '+esc(x._system)+'</p><p><b>Details:</b> '+esc(x.details||"No additional details")+'</p><p><a href="job-details.html?id='+encodeURIComponent(x.job_id)+(x._system!=="legacy"?"&system="+encodeURIComponent(x._system):"")+'" target="_blank" rel="noopener">View Job Page</a></p><label>Admin Note</label><textarea id="note-'+x.id+'" maxlength="2000" rows="2">'+esc(x.admin_note||"")+'</textarea><div class="row"><button class="btn secondary" data-id="'+x.id+'" data-system="'+x._system+'" data-status="reviewing">Under Review</button><button class="btn" data-id="'+x.id+'" data-system="'+x._system+'" data-status="actioned">Action Completed</button><button class="btn secondary" data-id="'+x.id+'" data-system="'+x._system+'" data-status="dismissed">Reject Report</button></div></article>';
 }).join("");
 $("reports").querySelectorAll("button[data-id]").forEach(b=>b.addEventListener("click",async()=>{
  b.disabled=true;try{const reviewFunctions={legacy:"tc_review_job_report",government:"tc_review_government_job_report",private:"tc_review_private_job_report",international:"tc_review_international_job_report"};
  const {error}=await db.rpc(reviewFunctions[b.dataset.system],{p_report_id:b.dataset.id,p_status:b.dataset.status,p_admin_note:$("note-"+b.dataset.id).value});if(error)throw error;await load()}catch(e){alert("Unable to refresh: "+e.message);b.disabled=false}
 }));
}
$("refresh").addEventListener("click",load);init().catch(e=>$("message").textContent=e.message||String(e));
</script><script src="assets/site-protection.js" defer></script></body></html>
